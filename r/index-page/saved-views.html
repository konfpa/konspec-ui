<!-- Named queries under the title, one of them current. This is the page's
     memory and it is the reason a buyer opens the register at 09:10 and is
     already looking at the twelve orders they care about.

     They are a <nav> of buttons with aria-current, not a tablist and not a
     radiogroup. A tablist promises panels that switch and arrow keys that own
     the row, and there are no panels here — there is one register that gets a
     different query. A radiogroup promises the same arrow keys and puts four
     named places behind one Tab stop. Both are contracts this row cannot keep.

     The whole point of the entry is the second state: the current view has been
     filtered away from. The page has to say so, and it has to offer three
     answers, because they are three different intentions — write the change into
     the view, keep the view and make a new one, or throw the change away. The
     rejected alternative is the one every register ships first: keep the changed
     filters silently under the saved name, and tomorrow morning "My open POs"
     is not what was saved and nobody can tell whether the view moved or the
     data did.

     The strip is a role="status" so the change is announced rather than only
     drawn, and it sits between the views and the filter row — after the thing
     that was modified and before the controls that modified it.

     Reset restores every filter the view holds, not just the one that was
     touched, because a view is one query and half of it is not a state anybody
     asked for. -->
<div data-kui="index-page/saved-views" class="h-[640px] overflow-y-auto rounded-xl border border-zinc-300 bg-zinc-100 text-zinc-900"
     x-data="{
       view: 'mine',
       status: 'Open', buyer: 'me',
       views: [
         { id: 'mine', name: 'My open POs', status: 'Open', buyer: 'me', count: 12 },
         { id: 'overdue', name: 'Overdue receipts', status: 'Overdue', buyer: '', count: 4 },
         { id: 'big', name: 'Above ₹5,00,000', status: '', buyer: '', count: 23 },
         { id: 'all', name: 'All orders', status: '', buyer: '', count: 1438 }
       ],
       rows: [
         { po: 'PO-2026-0411', vendor: 'Sharma Steel &amp; Alloys', amount: 1842000, status: 'Overdue', due: '12 Aug 2026' },
         { po: 'PO-2026-0418', vendor: 'Deccan Fasteners Pvt Ltd', amount: 2710400, status: 'Open', due: '02 Sep 2026' },
         { po: 'PO-2026-0421', vendor: 'Sharma Steel &amp; Alloys', amount: 132900, status: 'Open', due: '22 Aug 2026' },
         { po: 'PO-2026-0427', vendor: 'Gujarat Polymers Ltd', amount: 5460000, status: 'Approved', due: '30 Aug 2026' },
         { po: 'PO-2026-0430', vendor: 'Deccan Fasteners Pvt Ltd', amount: 214300, status: 'Overdue', due: '05 Aug 2026' },
         { po: 'PO-2026-0436', vendor: 'Konkan Chemicals Pvt Ltd', amount: 1290500, status: 'Open', due: '08 Sep 2026' }
       ],
       dot: { Open: 'bg-zinc-500', Approved: 'bg-amber-500', Overdue: 'bg-red-600', Closed: 'bg-emerald-600', Draft: 'bg-zinc-400' },
       money(n) { return '₹' + n.toLocaleString('en-IN') },
       get current() { return this.views.find(v => v.id === this.view) },
       get dirty() { return this.status !== this.current.status || this.buyer !== this.current.buyer },
       get filtered() { return this.rows.filter(r => !this.status || r.status === this.status) },
       pick(id) { this.view = id; this.status = this.current.status; this.buyer = this.current.buyer },
       reset() { this.status = this.current.status; this.buyer = this.current.buyer }
     }">

  <main>
    <header class="border-b border-zinc-200 bg-white">
      <div class="mx-auto max-w-[1600px] px-4 py-4 lg:px-6">

        <div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-3">
          <div class="min-w-0">
            <h1 class="text-[24px]/7 font-semibold tracking-tight">Purchase orders</h1>
            <p role="status" class="mt-1 text-[13px]/5 tabular-nums text-zinc-600"
               x-text="filtered.length + ' orders in ' + current.name + ' · Silvassa and Vapi · FY 2026–27'"></p>
          </div>
          <button type="button" class="flex items-center gap-2 rounded-lg bg-zinc-700 px-3.5 py-2 text-[13px]/5 font-medium text-white hover:bg-zinc-800 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
            <i data-lucide="plus" class="size-4"></i>New order
          </button>
        </div>

        <nav aria-label="Saved views" class="mt-3">
          <ul role="list" class="flex flex-wrap items-center gap-1.5">
            <template x-for="v in views" :key="v.id">
              <li>
                <button type="button" @click="pick(v.id)" :aria-current="v.id === view ? 'true' : 'false'"
                        class="flex items-center gap-1.5 rounded-full px-3 py-1 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
                        :class="v.id === view ? 'bg-zinc-200 font-medium text-zinc-900 ring-1 ring-inset ring-zinc-300' : 'text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900'">
                  <span x-text="v.name"></span>
                  <span class="tabular-nums text-zinc-500" x-text="v.count.toLocaleString('en-IN')"></span>
                  <span x-show="v.id === view &amp;&amp; dirty" x-cloak class="text-[12px]/4 font-medium text-zinc-600">· edited</span>
                </button>
              </li>
            </template>
            <li>
              <button type="button" class="flex items-center gap-1.5 rounded-full px-3 py-1 text-[13px]/5 text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
                <i data-lucide="settings-2" class="size-3.5"></i>Manage views
              </button>
            </li>
          </ul>
        </nav>

        <div x-show="dirty" x-cloak role="status"
             class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-2 rounded-lg border border-zinc-200 bg-zinc-50 px-3 py-2">
          <p class="min-w-0 text-[13px]/5 text-zinc-600">
            <span class="font-medium text-zinc-900" x-text="current.name"></span> has been changed and the change is not saved.
          </p>
          <div class="ml-auto flex flex-wrap items-center gap-2">
            <button type="button" @click="current.status = status; current.buyer = buyer"
                    class="inline-flex h-8 items-center rounded-lg bg-zinc-700 px-3 text-[13px]/5 font-medium text-white hover:bg-zinc-800 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Save to this view</button>
            <button type="button"
                    class="inline-flex h-8 items-center rounded-lg border border-zinc-200 bg-white px-3 text-[13px]/5 font-medium hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Save as a new view</button>
            <button type="button" @click="reset()"
                    class="text-[13px]/5 font-medium text-zinc-900 underline underline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Reset</button>
          </div>
        </div>

        <div class="mt-3 grid grid-cols-2 gap-2 sm:flex sm:flex-wrap sm:items-center">
          <div class="min-w-0">
            <label for="ix-sv-status" class="sr-only">Status</label>
            <select id="ix-sv-status" x-model="status"
                    class="w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-[13px]/5 font-medium focus:border-zinc-700 focus:outline-3 focus:outline-offset-2 focus:outline-zinc-700/15 sm:w-auto">
              <option value="">Status: all</option>
              <option value="Open">Status: open</option>
              <option value="Approved">Status: approved</option>
              <option value="Overdue">Status: overdue</option>
            </select>
          </div>
          <div class="min-w-0">
            <label for="ix-sv-buyer" class="sr-only">Raised by</label>
            <select id="ix-sv-buyer" x-model="buyer"
                    class="w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-[13px]/5 font-medium focus:border-zinc-700 focus:outline-3 focus:outline-offset-2 focus:outline-zinc-700/15 sm:w-auto">
              <option value="">Raised by: anyone</option>
              <option value="me">Raised by: me</option>
              <option value="team">Raised by: my team</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <div class="mx-auto max-w-[1600px] px-4 py-5 lg:px-6">
      <div class="rounded-xl border border-zinc-300 bg-white">
        <table class="w-full text-[13px]/5">
          <thead>
            <tr class="border-b border-zinc-200 text-left text-[11px]/4 font-medium tracking-wider text-zinc-600 uppercase">
              <th scope="col" class="px-4 py-2.5 font-medium whitespace-nowrap">PO number</th>
              <th scope="col" class="hidden px-4 py-2.5 font-medium sm:table-cell">Vendor</th>
              <th scope="col" class="px-4 py-2.5 text-right font-medium">Value</th>
              <th scope="col" class="hidden px-4 py-2.5 font-medium sm:table-cell">Status</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="r in filtered" :key="r.po">
              <tr class="border-b border-zinc-100 last:border-0 hover:bg-zinc-100">
                <td class="px-4 py-2.5 font-medium whitespace-nowrap tabular-nums" x-text="r.po"></td>
                <td class="hidden px-4 py-2.5 text-zinc-600 sm:table-cell" x-text="r.vendor"></td>
                <td class="px-4 py-2.5 text-right whitespace-nowrap tabular-nums" x-text="money(r.amount)"></td>
                <td class="hidden px-4 py-2.5 sm:table-cell">
                  <span class="inline-flex items-center gap-1.5 rounded-full bg-zinc-200 px-2 py-0.5 text-[12px]/4 text-zinc-700 ring-1 ring-inset ring-zinc-300">
                    <span class="size-1.5 shrink-0 rounded-full" :class="dot[r.status]" aria-hidden="true"></span><span x-text="r.status"></span>
                  </span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>

        <nav aria-label="Register pages" class="flex flex-wrap items-center justify-between gap-3 border-t border-zinc-200 px-4 py-2.5">
          <p class="text-[13px]/5 text-zinc-600 tabular-nums" x-text="'1–' + filtered.length + ' of ' + filtered.length + ' orders'"></p>
          <span class="text-[13px]/5 text-zinc-600 tabular-nums">Page 1 of 1</span>
        </nav>
      </div>
    </div>
  </main>
</div>
