<!-- The register in the second before the rows arrive, and the split is what
     matters: the page is drawn for real and only the panel is grey.

     Everything above the panel came with the document — the trail, the h1, the
     filter band, the primary action — so none of it waits, and none of it moves
     when the rows land. The search is live from the first frame: what somebody
     types in the first half-second goes into the request that replaces these
     rows. Disable it instead and the one control a person reaches for while a
     slow screen loads is the one that refuses them.

     The count line is the exception, because the count is genuinely not known
     until the query answers. It is a grey bar in the exact box the sentence will
     occupy, and the role="status" that will carry the count is already in the
     document — a live region that arrives with its message already in it is not
     a change and is announced to nobody.

     The header row is real, and it does two jobs: somebody can decide which
     column they are going to read before the figures land, and the browser sets
     the column widths from the same markup the loaded table uses, so no column
     moves on arrival.

     Five grey rows because the page size is five. Guess low where it is not
     known — growth pushes down only what is below the panel, while shrinkage
     pulls the whole page up under a cursor already moving.

     aria-busy sits on the panel and one sr-only status names what is loading.
     The grey rows are aria-hidden, or a screen reader walks twenty-five empty
     cells and is never told why.

     This is the first paint and nothing here is worth keeping. Once rows are up,
     a later page in flight keeps them and marks them inert; the register never
     comes back to this state. -->
