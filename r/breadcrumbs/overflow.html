<!-- Past four levels the middle collapses behind an ellipsis rather than
     wrapping onto a second line. The button says how many levels it hides,
     because an ellipsis on its own announces nothing.

     The hidden levels are a nested <ol> inside the <li> they collapsed from,
     not a menu. They are still crumbs and they are still in order, so the outer
     list reads as four items with three nested inside the second — which is the
     truth — and every one of them is an ordinary link the browser already knows
     how to move between. role="menu" here would promise arrow keys, Home and
     End and a single tab stop for the set, and this panel implements none of
     that; taking the role also stops the items being announced as links, which
     is the one thing they certainly are.

     The panel takes max-w-[calc(100vw-2rem)] because at 390px a fixed w-60
     anchored to a crumb halfway along the trail hangs off the right edge and
     pushes the page sideways.

     @click.stop on the button and the panel keeps the document-level handler
     from closing this menu the moment it opens. -->
<nav data-kui="breadcrumbs/overflow" aria-label="Breadcrumb" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.window="open = false">
  <ol class="flex flex-wrap items-center gap-1.5 text-[13px]/5">
    <li><a href="#" class="text-zinc-600 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Home</a></li>
    <li aria-hidden="true" class="text-zinc-500">/</li>
    <li class="relative">
      <button type="button" @click.stop="open = !open"
              aria-label="Show 3 hidden levels" :aria-expanded="open"
              class="rounded-md px-1.5 py-0.5 text-zinc-600 hover:bg-zinc-200 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">…</button>
      <ol x-show="open" x-cloak @click.stop
          class="absolute top-full left-0 z-40 mt-1 w-60 max-w-[calc(100vw-2rem)] overflow-hidden rounded-xl border border-zinc-300 bg-white py-1 shadow-lg">
        <li><a href="#" class="block truncate px-3 py-2 text-[13px]/5 hover:bg-zinc-100 focus-visible:bg-zinc-100 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-zinc-700">Procurement</a></li>
        <li><a href="#" class="block truncate px-3 py-2 text-[13px]/5 hover:bg-zinc-100 focus-visible:bg-zinc-100 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-zinc-700">Purchase orders</a></li>
        <li><a href="#" class="block truncate px-3 py-2 text-[13px]/5 hover:bg-zinc-100 focus-visible:bg-zinc-100 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-zinc-700">Gujarat Polymers Ltd</a></li>
      </ol>
    </li>
    <li aria-hidden="true" class="text-zinc-500">/</li>
    <li><a href="#" class="tabular-nums text-zinc-600 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">PO-24-1187</a></li>
    <li aria-hidden="true" class="text-zinc-500">/</li>
    <li><span aria-current="page" class="font-medium text-zinc-900">Line 4 — MS angle 50×50×6</span></li>
  </ol>
</nav>
