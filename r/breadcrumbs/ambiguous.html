<!-- One receipt, three plausible parents. Stores reached it from the receipt
     register, purchase reached it from PO-24-1187, and accounts reached it from
     the vendor. Each of those is a real relationship and none of them is the
     hierarchy.

     So the trail stops at the level that is the same for everybody — the
     register the record lives in — and the relationships are written under it,
     labelled, as ordinary links. A short honest trail beats a long one whose
     third crumb depends on the referrer: that crumb is browsing history wearing
     a hierarchy's clothes, and because it looks like structure it is believed.
     Two people compare notes on the same GRN and read different paths to it.

     The tempting alternative is to make the middle crumb a picker of the three
     parents. It is a control that changes what the page above it claims to be
     while the page itself does not change, and the first thing a user does with
     it is assume the record moved.

     Every link on that line is named by what the relationship is — order,
     vendor, store — and all three are underlined, unlike the crumbs. Between
     the label and the underline there is nothing left to mistake: what is in
     the <ol> is a level, what is under it is a related record, and a bare row
     of three links with no labels would read as the trail continuing. -->
