<!-- Two rows the user cannot open, for two different reasons, drawn two
     different ways. One treatment for both is the defect: it teaches people
     that a grey row means "ask someone" when half of them mean "come back on
     Monday".

     Rate contracts is closed by the state of the application. It is a page this
     buyer opens most days, so removing it while the revision posts would make
     the menu a different shape from one day to the next. It stays an anchor and
     keeps its href, takes aria-disabled, and points at the reason with
     aria-describedby. Dropping the href instead would make it unfocusable, and
     the sentence explaining it reachable by pointer only.

     Approval limits is refused by permission. There is no URL this user may
     follow, so there is no link to draw — a lock, the name, and who owns it. It
     is out of the tab order because there is nothing there to do, and still in
     the reading order, because "you cannot see this" is information. The
     default for a permission refusal is to leave the row out altogether; keep
     it only where its absence reads as the menu being broken.

     @click.prevent stops a click and nothing else. Ctrl-click and the address
     bar never see the attribute, so the view has to refuse it too.

     Neither row hovers. A hover fill is what tells a pointer something is a
     target. -->
<nav data-kui="navigation-menu/restricted" aria-label="Main" class="relative rounded-xl border border-zinc-300 bg-white p-1"
     x-data="{
       open: null,
       timer: 0,
       fine: window.matchMedia('(hover: hover) and (pointer: fine)').matches,
       hover(id) {
         if (!this.fine) return;
         clearTimeout(this.timer);
         if (this.open) { this.open = id; return }
         this.timer = setTimeout(() => this.open = id, 140);
       },
       leave() { clearTimeout(this.timer); this.timer = setTimeout(() => this.open = null, 280) },
       jump(id) {
         clearTimeout(this.timer);
         this.open = id;
         this.$nextTick(() => requestAnimationFrame(() => this.$refs[id + 'Panel']?.querySelector('a')?.focus()));
       },
       shut(back) { clearTimeout(this.timer); this.open = null; if (back) back.focus() }
     }"
     @mouseenter="clearTimeout(timer)"
     @mouseleave="leave()"
     @focusout="if (!$el.contains($event.relatedTarget)) shut()"
     @click.outside="shut()"
     @keydown.escape="if (open) { $event.stopPropagation(); shut($refs[open]) }">
  <ul class="flex flex-wrap items-center gap-1">
    <li class="relative">
      <button type="button" x-ref="proc" id="nmr-t-proc"
              aria-controls="nmr-p-proc" :aria-expanded="open === 'proc'"
              @mouseenter="hover('proc')"
              @click="open === 'proc' ? shut($refs.proc) : jump('proc')"
              @keydown.arrow-down.prevent="jump('proc')"
              class="flex items-center gap-1.5 rounded-lg px-3 py-2 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="open === 'proc' ? 'bg-zinc-200 font-medium text-zinc-900 hover:bg-zinc-300' : 'text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900'">
        Procurement
        <span class="flex transition-transform motion-reduce:transition-none" :class="open === 'proc' && 'rotate-180'">
          <i data-lucide="chevron-down" class="size-3.5 text-zinc-600"></i>
        </span>
      </button>

      <div x-ref="procPanel" x-show="open === 'proc'" x-cloak
           id="nmr-p-proc" role="group" aria-labelledby="nmr-t-proc"
           class="absolute top-full left-0 z-40 pt-2">
        <ul class="w-72 max-w-[calc(100vw-2rem)] rounded-xl border border-zinc-200 bg-white p-2 shadow-lg">
          <li><a href="/procurement/" class="block rounded-lg px-3 py-2 text-[13px]/5 font-medium text-zinc-900 hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">All of Procurement</a></li>
          <li><a href="/procurement/orders/" class="block rounded-lg px-3 py-2 text-[13px]/5 text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Purchase orders</a></li>
          <li><a href="/procurement/requisitions/" class="block rounded-lg px-3 py-2 text-[13px]/5 text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Requisitions</a></li>

          <li>
            <a href="/procurement/contracts/" aria-disabled="true" aria-describedby="nmr-why-rc" @click.prevent
               class="block rounded-lg px-3 py-2 text-[13px]/5 text-zinc-600 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Rate contracts</a>
            <p id="nmr-why-rc" class="flex items-start gap-1.5 px-3 pb-2 text-[12px]/4 text-zinc-500">
              <i data-lucide="lock" class="size-3.5 shrink-0 translate-y-px"></i>
              <span class="tabular-nums">Closed while the FY 2026-27 revision posts. Back 01 Sep 2026.</span>
            </p>
          </li>

          <li class="flex items-start gap-1.5 px-3 py-2">
            <i data-lucide="lock" class="size-3.5 shrink-0 translate-y-1 text-zinc-500"></i>
            <span class="min-w-0">
              <span class="block text-[13px]/5 text-zinc-500">Approval limits</span>
              <span class="block text-[12px]/4 text-zinc-500">Plant head only — Ritu Deshpande</span>
            </span>
          </li>
        </ul>
      </div>
    </li>

    <li>
      <a href="/inventory/" @mouseenter="if (open) shut()"
         class="block rounded-lg px-3 py-2 text-[13px]/5 text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Inventory</a>
    </li>
    <li>
      <a href="/reports/" @mouseenter="if (open) shut()"
         class="block rounded-lg px-3 py-2 text-[13px]/5 text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Reports</a>
    </li>
  </ul>
</nav>
