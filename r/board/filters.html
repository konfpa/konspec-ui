<!-- A filtered board is a board of lies unless every count says so, and that is
     the whole variant. Four in With buyer is a fact about the plant; four of
     nine in With buyer is a fact about the screen. Print the unqualified figure
     while two filters are in force and somebody schedules a shift against it.

     Every column count reads "n of m" while any filter is set, and the line
     under the title says how many records are off the board altogether. They
     revert to the plain figure when the last chip goes, because "9 of 9" on an
     unfiltered board trains people to ignore the qualifier on the day it means
     something.

     The chips are removable one at a time — the usual cause is one filter out
     of two — on a bg-zinc-50 band with a zinc-200 rule, which is empty-state's
     filtered variant unchanged. Clearing them all deletes the control that did
     it, so the handler moves focus to the count line, which is tabindex="-1"
     for exactly that and is also the sentence saying what happened.

     No create button on a filtered board: the records exist and the filter is
     hiding them. Filtering never moves a card and never changes a stage — a
     card the filter excludes is not at another stage, it is not on the screen. -->
<main data-kui="board/filters" class="flex h-[620px] flex-col overflow-hidden rounded-xl border border-zinc-300 bg-stone-100 text-[14px]/5 text-zinc-900"
      x-data="{
        chips: ['Silvassa', 'Buyer: Meera Joshi'],
        stages: [
          { id: 'raised', name: 'Raised' },
          { id: 'buyer', name: 'With buyer' },
          { id: 'finance', name: 'With finance' },
          { id: 'approved', name: 'Approved' }
        ],
        cards: [
          { no: 'PO-2026-0418', stage: 'raised', vendor: 'Sharma Steel &amp; Alloys', value: 1842000, age: 2, hit: false },
          { no: 'PO-2026-0421', stage: 'raised', vendor: 'Gujarat Polymers Ltd', value: 715600, age: 1, hit: true },
          { no: 'PO-2026-0409', stage: 'buyer', vendor: 'Deccan Fasteners Pvt Ltd', value: 284300, age: 6, hit: false },
          { no: 'PO-2026-0412', stage: 'buyer', vendor: 'Konkan Packaging Co', value: 109750, age: 4, hit: false },
          { no: 'PO-2026-0416', stage: 'buyer', vendor: 'Nashik Steel Traders', value: 96750, age: 3, hit: true },
          { no: 'PO-2026-0402', stage: 'finance', vendor: 'Qureshi Metals', value: 546000, age: 9, hit: false },
          { no: 'PO-2026-0407', stage: 'finance', vendor: 'Baroda Fasteners Pvt Ltd', value: 318400, age: 7, hit: false },
          { no: 'PO-2026-0398', stage: 'approved', vendor: 'Deshpande Traders', value: 214300, age: 12, hit: true },
          { no: 'PO-2026-0395', stage: 'approved', vendor: 'Silvassa Hydraulics', value: 1160000, age: 14, hit: false }
        ],
        all(s) { return this.cards.filter(c => c.stage === s).length },
        at(s) { return this.cards.filter(c => c.stage === s &amp;&amp; (this.chips.length ? c.hit : true)) },
        shown(s) { return this.chips.length ? this.at(s.id).length + ' of ' + this.all(s.id) : String(this.all(s.id)) },
        get total() { return this.cards.length },
        get on() { return this.chips.length ? this.cards.filter(c => c.hit).length : this.cards.length },
        money(n) { return '₹' + n.toLocaleString('en-IN') },
        clearAll() {
          this.chips = [];
          this.$nextTick(() => this.$refs.count.focus());
        }
      }">

  <div class="shrink-0 border-b border-zinc-300 bg-white">
    <div class="flex flex-wrap items-end justify-between gap-x-4 gap-y-2 px-4 py-3">
      <div class="min-w-0">
        <h1 class="text-[20px]/7 font-semibold tracking-tight">Order approvals</h1>
        <p role="status" x-ref="count" tabindex="-1"
           class="mt-0.5 text-[12px]/4 tabular-nums text-zinc-600 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
           x-text="chips.length ? on + ' of ' + total + ' orders on the board · ' + (total - on) + ' hidden by ' + chips.length + ' filters' : total + ' orders on the board'"></p>
      </div>
      <button type="button" class="inline-flex h-9 shrink-0 items-center gap-2 rounded-lg border border-zinc-200 bg-white px-3 text-[13px]/5 font-medium hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
        <i data-lucide="sliders-horizontal" class="size-4 text-zinc-600"></i>Filters
      </button>
    </div>

    <div x-show="chips.length" class="flex flex-wrap items-center gap-2 border-t border-zinc-200 bg-zinc-50 px-4 py-2">
      <template x-for="f in chips" :key="f">
        <span class="inline-flex items-center gap-1.5 rounded-full bg-zinc-200 py-0.5 pr-1 pl-2.5 text-[12px]/4 font-medium text-zinc-700 ring-1 ring-inset ring-zinc-300">
          <span x-text="f"></span>
          <button type="button" @click="chips = chips.filter(x => x !== f)" :aria-label="'Remove the filter ' + f"
                  class="flex size-4 items-center justify-center rounded-full text-zinc-600 hover:bg-zinc-300 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
            <i data-lucide="x" class="size-3"></i>
          </button>
        </span>
      </template>
      <button type="button" @click="clearAll()"
              class="text-[12px]/4 font-medium text-zinc-900 underline underline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
        Clear all
      </button>
    </div>
  </div>

  <div class="flex min-h-0 flex-1 snap-x snap-mandatory gap-3 overflow-x-auto p-3">
    <template x-for="s in stages" :key="s.id">
      <section :aria-labelledby="'ft-h-' + s.id"
               class="relative flex w-72 shrink-0 snap-start flex-col overflow-hidden rounded-xl border border-zinc-300 bg-white">

        <div class="flex shrink-0 items-baseline justify-between gap-2 border-b border-zinc-200 px-3 py-2.5">
          <h2 :id="'ft-h-' + s.id" class="truncate text-[13px]/5 font-medium" x-text="s.name"></h2>
          <p class="shrink-0 text-[12px]/4 tabular-nums text-zinc-500" x-text="shown(s)"></p>
        </div>

        <ul role="list" class="min-h-0 flex-1 space-y-2 overflow-y-auto bg-zinc-50 p-2">
          <template x-for="c in at(s.id)" :key="c.no">
            <li class="rounded-lg border border-zinc-200 bg-white p-2.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <a href="#" class="text-[13px]/5 font-medium tabular-nums text-zinc-900 underline underline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15" x-text="c.no"></a>
                  <p class="mt-0.5 truncate text-[12px]/4 text-zinc-600" x-text="c.vendor"></p>
                </div>
                <button type="button" :aria-label="'Move ' + c.no + ', now in ' + s.name"
                        class="flex size-9 shrink-0 items-center justify-center rounded-lg border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
                  <i data-lucide="arrow-right-left" class="size-4"></i>
                </button>
              </div>
              <div class="mt-2 flex items-center justify-between gap-2">
                <span class="text-[13px]/5 font-medium tabular-nums" x-text="money(c.value)"></span>
                <span class="text-[12px]/4 tabular-nums text-zinc-500" x-text="c.age + 'd here'"></span>
              </div>
            </li>
          </template>

          <li x-show="chips.length &amp;&amp; !at(s.id).length" x-cloak class="px-2 py-6 text-center text-[12px]/4 tabular-nums text-zinc-500">
            <span x-text="all(s.id)"></span> at this stage, none matching the filters
          </li>
        </ul>
      </section>
    </template>
  </div>
</main>
