<!-- Drag, and the conditions on offering it at all.

     It is added to a board whose move control already works, it calls the same
     commit() the menu calls, and it adds nothing of its own. The board is
     complete with drag switched off — which is what it is on every touch
     screen, where these events never fire, and for every keyboard user.

     dragover has to preventDefault or the drop never fires, and that is the
     commonest reason a hand-rolled board looks like it works right up until the
     card is released.

     dataTransfer carries the record number and nothing else; the board already
     holds the record.

     The drop target is the column and there is no insertion point between
     cards. Order within a stage belongs to the server, so a board that lets
     somebody drop between two cards promises an ordering it throws away.

     over is one stage id on the root and not a boolean per column: dragleave
     fires on every child element, which is what makes them flicker. -->
<main data-kui="board/drag" class="flex h-[560px] flex-col overflow-hidden rounded-xl border border-zinc-300 bg-stone-100 text-[14px]/5 text-zinc-900"
      x-data="{
        said: '', over: null, open: null,
        stages: [
          { id: 'cut', name: 'Cut' },
          { id: 'welded', name: 'Welded' },
          { id: 'painted', name: 'Painted' }
        ],
        cards: [
          { no: 'JOB-2026-3318', stage: 'cut', item: 'Hopper shell 2.4 m', mt: 2.4 },
          { no: 'JOB-2026-3319', stage: 'cut', item: 'Support bracket set', mt: 0.6 },
          { no: 'JOB-2026-3301', stage: 'welded', item: 'Chute liner assembly', mt: 1.2 },
          { no: 'JOB-2026-3302', stage: 'welded', item: 'Conveyor frame 4 m', mt: 1.4 },
          { no: 'JOB-2026-3288', stage: 'painted', item: 'Hopper shell 1.8 m', mt: 1.9 }
        ],
        at(s) { return this.cards.filter(c => c.stage === s) },
        label(s) { return this.stages.find(x => x.id === s).name },
        drop(e, to) {
          this.over = null;
          const no = e.dataTransfer.getData('text/plain');
          if (!no) return;
          const c = this.cards.find(x => x.no === no);
          if (!c || c.stage === to) return;
          this.commit(no, to);
        },
        commit(no, to) {
          const board = this.$refs.board;
          const c = this.cards.find(x => x.no === no);
          const from = this.label(c.stage);
          c.stage = to;
          this.open = null;
          this.said = no + ' moved from ' + from + ' to ' + this.label(to) + '. ' + this.label(to) + ' now holds ' + this.at(to).length + ' jobs.';
          this.$nextTick(() => requestAnimationFrame(() => {
            const el = board.querySelector('[data-move=' + no + ']');
            if (el) { el.focus(); el.scrollIntoView({ block: 'nearest', inline: 'nearest' }) }
          }));
        }
      }">

  <p role="status" class="sr-only" x-text="said"></p>

  <div class="shrink-0 border-b border-zinc-300 bg-white px-4 py-3">
    <h1 class="text-[20px]/7 font-semibold tracking-tight">Fabrication board</h1>
    <p class="mt-0.5 text-[12px]/4 text-zinc-600">Drag a card, or move it from its own control. Both do the same thing.</p>
  </div>

  <div x-ref="board" class="flex min-h-0 flex-1 snap-x snap-mandatory gap-3 overflow-x-auto p-3">
    <template x-for="s in stages" :key="s.id">
      <section :aria-labelledby="'dg-h-' + s.id"
               class="relative flex w-72 shrink-0 snap-start flex-col overflow-hidden rounded-xl border bg-white"
               :class="over === s.id ? 'border-zinc-700' : 'border-zinc-300'"
               @dragover.prevent="over = s.id"
               @dragleave="if (!$el.contains($event.relatedTarget)) over = null"
               @drop.prevent="drop($event, s.id)">

        <div class="flex shrink-0 items-baseline justify-between gap-2 border-b border-zinc-200 px-3 py-2.5">
          <h2 :id="'dg-h-' + s.id" class="truncate text-[13px]/5 font-medium" x-text="s.name"></h2>
          <p class="shrink-0 text-[12px]/4 tabular-nums text-zinc-500" x-text="at(s.id).length"></p>
        </div>

        <ul role="list" class="min-h-0 flex-1 space-y-2 overflow-y-auto p-2" :class="over === s.id ? 'bg-zinc-100' : 'bg-zinc-50'">
          <template x-for="c in at(s.id)" :key="c.no">
            <li draggable="true" @dragstart="$event.dataTransfer.setData('text/plain', c.no); $event.dataTransfer.effectAllowed = 'move'"
                @dragend="over = null"
                class="rounded-lg border border-zinc-200 bg-white p-2.5 hover:bg-zinc-100">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <a href="#" class="text-[13px]/5 font-medium tabular-nums text-zinc-900 underline underline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15" x-text="c.no"></a>
                  <p class="mt-0.5 truncate text-[12px]/4 text-zinc-600" x-text="c.item"></p>
                </div>
                <button type="button" :data-move="c.no" @click="open = open === c.no ? null : c.no"
                        :aria-expanded="open === c.no" :aria-label="'Move ' + c.no + ', now in ' + label(c.stage)"
                        class="flex size-9 shrink-0 items-center justify-center rounded-lg border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
                  <i data-lucide="arrow-right-left" class="size-4"></i>
                </button>
              </div>
              <p class="mt-2 text-[12px]/4 tabular-nums text-zinc-500" x-text="c.mt + ' MT'"></p>

              <div x-show="open === c.no" x-cloak class="mt-2.5 border-t border-zinc-100 pt-2.5"
                   @keydown.escape.stop="open = null; $nextTick(() => $refs.board.querySelector('[data-move=' + c.no + ']').focus())">
                <p class="text-[11px]/4 font-medium uppercase tracking-wider text-zinc-600">Move to</p>
                <div role="group" :aria-label="'Move ' + c.no + ' to'" class="mt-1.5 space-y-1">
                  <template x-for="d in stages.filter(x => x.id !== c.stage)" :key="d.id">
                    <button type="button" @click="commit(c.no, d.id)"
                            class="flex h-9 w-full items-center justify-between gap-2 rounded-lg border border-zinc-200 bg-white px-2.5 text-left text-[13px]/5 font-medium hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
                      <span class="truncate" x-text="d.name"></span>
                      <span class="shrink-0 text-[12px]/4 tabular-nums text-zinc-500" x-text="at(d.id).length"></span>
                    </button>
                  </template>
                </div>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </template>
  </div>
</main>
