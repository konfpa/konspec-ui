<!-- The header carries what the count alone will not answer. Four orders in
     With finance is a queue length; ₹8,64,400 in With finance is money that has
     not been committed yet, and that is the number the meeting is about.

     Both figures are getters over the same array the cards render from. Held
     beside it they are wrong for the one second after a move when somebody is
     looking at them, which is the only second that matters.

     The board total is under the columns and it does not move. A stage change
     moves value between two columns and adds none to the board, so a total that
     changes when a card moves is double counting — and that defect is invisible
     until somebody reconciles the board against the ledger a month later.

     The oldest card at a stage is the other figure a board is asked for, and it
     goes in the header rather than on a card, because it is a property of the
     column: it is what says which stage is stuck even when the count is small.

     Values are formatted with en-IN, so the grouping is 18,42,000 and not
     1,842,000. Everything numeric takes tabular-nums, so the column of figures
     down the board lines up. -->
<main data-kui="board/totals" class="flex h-[620px] flex-col overflow-hidden rounded-xl border border-zinc-300 bg-stone-100 text-[14px]/5 text-zinc-900"
      x-data="{
        said: '', open: null,
        stages: [
          { id: 'raised', name: 'Raised' },
          { id: 'buyer', name: 'With buyer' },
          { id: 'finance', name: 'With finance' },
          { id: 'approved', name: 'Approved' }
        ],
        cards: [
          { no: 'PO-2026-0418', stage: 'raised', vendor: 'Sharma Steel &amp; Alloys', value: 1842000, age: 2 },
          { no: 'PO-2026-0421', stage: 'raised', vendor: 'Gujarat Polymers Ltd', value: 715600, age: 1 },
          { no: 'PO-2026-0409', stage: 'buyer', vendor: 'Deccan Fasteners Pvt Ltd', value: 284300, age: 6 },
          { no: 'PO-2026-0412', stage: 'buyer', vendor: 'Konkan Packaging Co', value: 109750, age: 4 },
          { no: 'PO-2026-0416', stage: 'buyer', vendor: 'Nashik Steel Traders', value: 96750, age: 3 },
          { no: 'PO-2026-0402', stage: 'finance', vendor: 'Qureshi Metals', value: 546000, age: 9 },
          { no: 'PO-2026-0407', stage: 'finance', vendor: 'Baroda Fasteners Pvt Ltd', value: 318400, age: 7 },
          { no: 'PO-2026-0398', stage: 'approved', vendor: 'Deshpande Traders', value: 214300, age: 12 },
          { no: 'PO-2026-0395', stage: 'approved', vendor: 'Silvassa Hydraulics', value: 1160000, age: 14 }
        ],
        at(s) { return this.cards.filter(c => c.stage === s) },
        sum(s) { return this.at(s).reduce((t, c) => t + c.value, 0) },
        oldest(s) { return this.at(s).reduce((m, c) => Math.max(m, c.age), 0) },
        label(s) { return this.stages.find(x => x.id === s).name },
        money(n) { return '₹' + n.toLocaleString('en-IN') },
        get total() { return this.cards.reduce((t, c) => t + c.value, 0) },
        shut(no) { this.open = null; this.$nextTick(() => this.$refs.board.querySelector('[data-move=' + no + ']').focus()) },
        commit(no, to) {
          const board = this.$refs.board;
          const c = this.cards.find(x => x.no === no);
          const from = this.label(c.stage);
          c.stage = to;
          this.open = null;
          this.said = no + ' moved from ' + from + ' to ' + this.label(to) + '. ' + this.label(to) + ' now holds ' + this.at(to).length + ' orders worth ' + this.money(this.sum(to)) + '.';
          this.$nextTick(() => requestAnimationFrame(() => {
            const el = board.querySelector('[data-move=' + no + ']');
            if (el) { el.focus(); el.scrollIntoView({ block: 'nearest', inline: 'nearest' }) }
          }));
        }
      }">

  <p role="status" class="sr-only" x-text="said"></p>

  <div class="shrink-0 border-b border-zinc-300 bg-white px-4 py-3">
    <h1 class="text-[20px]/7 font-semibold tracking-tight">Order approvals</h1>
    <p class="mt-0.5 text-[12px]/4 tabular-nums text-zinc-600">Silvassa · FY 2026–27</p>
  </div>

  <div x-ref="board" class="flex min-h-0 flex-1 snap-x snap-mandatory gap-3 overflow-x-auto p-3">
    <template x-for="s in stages" :key="s.id">
      <section :aria-labelledby="'tt-h-' + s.id"
               class="relative flex w-72 shrink-0 snap-start flex-col overflow-hidden rounded-xl border border-zinc-300 bg-white">

        <div class="shrink-0 border-b border-zinc-200 px-3 py-2.5">
          <div class="flex items-baseline justify-between gap-2">
            <h2 :id="'tt-h-' + s.id" class="truncate text-[13px]/5 font-medium" x-text="s.name"></h2>
            <p class="shrink-0 text-[13px]/5 font-semibold tabular-nums" x-text="money(sum(s.id))"></p>
          </div>
          <p class="mt-0.5 text-[12px]/4 tabular-nums text-zinc-500">
            <span x-text="at(s.id).length"></span> orders · oldest <span x-text="oldest(s.id)"></span>d
          </p>
        </div>

        <ul role="list" class="min-h-0 flex-1 space-y-2 overflow-y-auto bg-zinc-50 p-2">
          <template x-for="c in at(s.id)" :key="c.no">
            <li class="rounded-lg border border-zinc-200 bg-white p-2.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <a href="#" class="text-[13px]/5 font-medium tabular-nums text-zinc-900 underline underline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15" x-text="c.no"></a>
                  <p class="mt-0.5 truncate text-[12px]/4 text-zinc-600" x-text="c.vendor"></p>
                </div>
                <button type="button" :data-move="c.no" @click="open = open === c.no ? null : c.no"
                        :aria-expanded="open === c.no" :aria-label="'Move ' + c.no + ', now in ' + label(c.stage)"
                        class="flex size-9 shrink-0 items-center justify-center rounded-lg border border-zinc-200 bg-white text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
                  <i data-lucide="arrow-right-left" class="size-4"></i>
                </button>
              </div>
              <div class="mt-2 flex items-center justify-between gap-2">
                <span class="text-[13px]/5 font-medium tabular-nums" x-text="money(c.value)"></span>
                <span class="text-[12px]/4 tabular-nums text-zinc-500" x-text="c.age + 'd here'"></span>
              </div>

              <div x-show="open === c.no" x-cloak class="mt-2.5 border-t border-zinc-100 pt-2.5" @keydown.escape.stop="shut(c.no)">
                <p class="text-[11px]/4 font-medium uppercase tracking-wider text-zinc-600">Move to</p>
                <div role="group" :aria-label="'Move ' + c.no + ' to'" class="mt-1.5 space-y-1">
                  <template x-for="d in stages.filter(x => x.id !== c.stage)" :key="d.id">
                    <button type="button" @click="commit(c.no, d.id)"
                            class="flex h-9 w-full items-center justify-between gap-2 rounded-lg border border-zinc-200 bg-white px-2.5 text-left text-[13px]/5 font-medium hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
                      <span class="truncate" x-text="d.name"></span>
                      <span class="shrink-0 text-[12px]/4 tabular-nums text-zinc-500" x-text="money(sum(d.id))"></span>
                    </button>
                  </template>
                </div>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </template>
  </div>

  <!-- Unchanged by any move. Only the split across the columns changes. -->
  <div class="flex shrink-0 flex-wrap items-center justify-between gap-x-4 gap-y-1 border-t border-zinc-300 bg-white px-4 py-2.5">
    <p class="text-[12px]/4 tabular-nums text-zinc-600">
      <span class="font-medium text-zinc-900" x-text="cards.length"></span> orders on the board · a move changes two columns and not this line
    </p>
    <p class="text-[14px]/5 font-semibold tabular-nums" x-text="money(total)"></p>
  </div>
</main>
