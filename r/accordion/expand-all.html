<!-- A QC report is read two ways: down the headings, looking for the check that
     failed, and end to end, when somebody is signing it off or printing it.
     One control serves the second reading, and it is one button rather than two
     because Expand all and Collapse all side by side means one of them is
     always the dead one.

     Its label is computed from the state, never toggled from a flag of its own.
     Open the last section by hand and the button has to already say Collapse
     all; with a flag it says Expand all, the press collapses nothing anybody
     can see, and the control reads as broken. allOpen is the same array the
     sections paint from, so the two cannot drift.

     The button is not aria-expanded. That attribute describes what this control
     itself opens, and this one opens five things — so it takes aria-controls
     listing all five panel ids, which is what the space-separated form is for.
     The label carries the rest: it says which way the next press will go, and
     the count beside it says where the set is now.

     Panel ids come from the record key through the loop, never from the loop
     index. Filter one check out on a permission and an index-derived id leaves
     the fourth header pointing at the third panel.

     The result marker is a dot, so a column of five reads as a column: the two
     that need attention are the red one and the amber one, and nothing else on
     the row is competing with them for colour. -->
<div data-kui="accordion/expand-all"
     x-data="{
       open: [],
       checks: [
         { id: 'visual',  label: 'Visual and surface', dot: 'bg-emerald-600', result: 'Pass',      body: '12 of 12 samples clean. No flow marks, no contamination, no colour drift against the retained standard.' },
         { id: 'dim',     label: 'Dimensional',        dot: 'bg-red-600',     result: '2 rejects', body: 'Wall thickness 2.14 mm and 2.11 mm against a 2.20 mm minimum on samples 7 and 9. Lot held.' },
         { id: 'hard',    label: 'Hardness',           dot: 'bg-emerald-600', result: 'Pass',      body: '214 BHN mean across 5 readings, inside the 190–240 BHN band.' },
         { id: 'coat',    label: 'Coating thickness',  dot: 'bg-amber-500',   result: 'Marginal',  body: '48 microns mean against a 45 micron floor. Two readings at 45.4 and 45.9 microns.' },
         { id: 'docs',    label: 'Documents',          dot: 'bg-emerald-600', result: 'Complete',  body: 'Mill test certificate per heat number, packing list and e-way bill EWB-3311-8842 on file.' }
       ],
       has(id) { return this.open.includes(id) },
       toggle(id) { this.open = this.has(id) ? this.open.filter(x => x !== id) : [...this.open, id] },
       get allOpen() { return this.open.length === this.checks.length },
       everything() { this.open = this.allOpen ? [] : this.checks.map(c => c.id) },
       panels() { return this.checks.map(c => 'acc-qc-' + c.id).join(' ') }
     }">

  <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 pb-2">
    <h2 class="min-w-0 flex-1 text-[16px]/6 font-semibold">Inspection IR-2026-0884</h2>
    <p class="shrink-0 text-[12px]/4 tabular-nums text-zinc-600" x-text="open.length + ' of ' + checks.length + ' open'">0 of 5 open</p>
    <button type="button" @click="everything()" :aria-controls="panels()"
            class="inline-flex h-9 shrink-0 items-center gap-2 rounded-lg px-3 text-[13px]/5 font-medium hover:bg-zinc-200 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
      <span class="flex transition-transform motion-reduce:transition-none" :class="allOpen && 'rotate-180'">
        <i data-lucide="chevrons-up-down" class="size-4 text-zinc-600"></i>
      </span>
      <span x-text="allOpen ? 'Collapse all' : 'Expand all'">Expand all</span>
    </button>
  </div>

  <div class="divide-y divide-zinc-100 overflow-hidden rounded-xl border border-zinc-300 bg-white">
    <template x-for="c in checks" :key="c.id">
      <div>
        <h3>
          <button type="button" @click="toggle(c.id)" :aria-expanded="has(c.id)" :aria-controls="'acc-qc-' + c.id"
                  class="flex min-h-12 w-full items-center gap-3 px-4 py-2 text-left hover:bg-zinc-100 focus-visible:outline-3 focus-visible:-outline-offset-2 focus-visible:outline-zinc-700/15">
            <span class="flex min-w-0 flex-1 flex-wrap items-center gap-x-3 gap-y-1">
              <span class="text-[14px]/5 font-medium" x-text="c.label"></span>
              <span class="ml-auto flex items-center gap-1.5 text-[12px]/4 text-zinc-600">
                <span aria-hidden="true" class="size-1.5 shrink-0 rounded-full" :class="c.dot"></span>
                <span x-text="c.result"></span>
              </span>
            </span>
            <span class="flex shrink-0 transition-transform motion-reduce:transition-none" :class="has(c.id) && 'rotate-180'">
              <i data-lucide="chevron-down" class="size-4 text-zinc-600"></i>
            </span>
          </button>
        </h3>
        <div :id="'acc-qc-' + c.id" x-show="has(c.id)" x-cloak x-collapse.duration.200ms>
          <p class="border-t border-zinc-100 px-4 py-3 text-[14px]/5 tabular-nums text-zinc-600" x-text="c.body"></p>
        </div>
      </div>
    </template>
  </div>
</div>
