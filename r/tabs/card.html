<!-- The tabs section the card they are drawn in, so the row lives inside it,
     joined to the header rule by -mb-px the way the underline variant joins the
     page rule.

     Print is a sibling of the tablist, not a member of it. Anything inside
     role="tablist" is counted as a tab: the button is announced as "tab 4 of 4",
     the arrow keys walk onto it, and the roving tabindex sets its tabindex to
     -1, so the one control in the header that is not a tab becomes the one
     control a keyboard cannot reach. It also sits on the title row rather than
     the tab row, because at 390px an action beside three tabs leaves neither of
     them room.

     The card already has a heading, so the tab row is not a <nav> and carries no
     landmark of its own. Its aria-label names the set of views, which is a
     different job from naming the record.

     The panel is the card body and takes the body padding, so the focus outline
     has 16px to sit in and keeps the positive offset. Flush against the card
     edge it would need the negative one, because overflow-hidden clips it. -->
<div data-kui="tabs/card" x-id="['tab', 'panel']"
     x-data="{
       tab: 'lines',
       items: [
         { id: 'lines',    label: 'Lines',    count: 14 },
         { id: 'receipts', label: 'Receipts', count: 3 },
         { id: 'notes',    label: 'Notes' }
       ],
       tabEls() { return Array.from(this.$refs.list.querySelectorAll('[role=tab]')); },
       move(step) {
         const n = this.items.length;
         const i = this.items.findIndex(t => t.id === this.tab);
         this.pick(this.items[(i + step + n) % n].id);
       },
       pick(id) {
         this.tab = id;
         this.$nextTick(() => {
           const el = this.tabEls().find(e => e.dataset.tab === id);
           if (el) el.focus();
         });
       }
     }"
     class="max-w-2xl overflow-hidden rounded-xl border border-zinc-300 bg-white">
  <div class="flex flex-wrap items-start justify-between gap-x-4 gap-y-3 px-4 pt-4">
    <div class="min-w-0">
      <h2 class="truncate text-[16px]/6 font-semibold tabular-nums">PO-24-1187</h2>
      <p class="mt-0.5 truncate text-[12px]/4 tabular-nums text-zinc-500">Gujarat Polymers Ltd · 04 Sep 2026</p>
    </div>
    <button type="button" class="inline-flex h-8 shrink-0 items-center gap-2 rounded-lg border border-zinc-200 bg-white px-3 text-[13px]/5 font-medium hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
      <i data-lucide="printer" class="size-4 text-zinc-600"></i>Print
    </button>
  </div>

  <div class="mt-3 border-b border-zinc-200 px-4">
    <div x-ref="list" role="tablist" aria-label="Purchase order sections"
         @keydown.arrow-right.prevent="move(1)"
         @keydown.arrow-left.prevent="move(-1)"
         @keydown.home.prevent="pick(items[0].id)"
         @keydown.end.prevent="pick(items[items.length - 1].id)"
         class="-mb-px flex gap-6">
      <template x-for="t in items" :key="t.id">
        <button type="button" role="tab" :data-tab="t.id"
                :id="$id('tab', t.id)" :aria-controls="$id('panel', t.id)"
                :aria-selected="tab === t.id ? 'true' : 'false'"
                :tabindex="tab === t.id ? 0 : -1"
                @click="pick(t.id)"
                class="flex shrink-0 items-center gap-2 rounded-t border-b-2 pb-2.5 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
                :class="tab === t.id ? 'border-zinc-900 font-semibold text-zinc-900' : 'border-transparent text-zinc-600 hover:text-zinc-900'">
          <span x-text="t.label"></span>
          <template x-if="t.count">
            <span class="rounded-full bg-zinc-200 px-1.5 py-0.5 text-[11px]/4 tabular-nums text-zinc-700 ring-1 ring-inset ring-zinc-300" x-text="t.count"></span>
          </template>
        </button>
      </template>
    </div>
  </div>

  <div class="p-4 text-[14px]/5">
    <div role="tabpanel" tabindex="0" :id="$id('panel', 'lines')" :aria-labelledby="$id('tab', 'lines')"
         x-show="tab === 'lines'"
         class="rounded-lg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
      <p>14 lines, <span class="font-medium tabular-nums">₹18,42,000</span> before tax.</p>
      <p class="mt-1 text-[13px]/5 tabular-nums text-zinc-500">HDPE granules 24.5 MT · fasteners 1,200 nos</p>
    </div>
    <div role="tabpanel" tabindex="0" :id="$id('panel', 'receipts')" :aria-labelledby="$id('tab', 'receipts')"
         x-show="tab === 'receipts'" x-cloak
         class="rounded-lg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
      <p class="text-zinc-600">GRN-26-0431, GRN-26-0438 and GRN-26-0442 posted against this order.</p>
    </div>
    <div role="tabpanel" tabindex="0" :id="$id('panel', 'notes')" :aria-labelledby="$id('tab', 'notes')"
         x-show="tab === 'notes'" x-cloak
         class="rounded-lg focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
      <p class="text-zinc-600">Vendor asked for the delivery window to move a week. Not agreed.</p>
    </div>
  </div>
</div>
