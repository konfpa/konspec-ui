<!-- The fetch failed. Drawn on its own, because the failure is a state the
     server renders and not one the page can reach by itself.

     htmx does not swap a 4xx or a 5xx. Left alone, a tab whose request errors
     moves the underline, leaves the previous section's content sitting in the
     panel, and reports nothing — which is worse than an empty panel, because
     the row now says Receipts over a table of lines and the user has no reason
     to disbelieve it. So the view answers 200 with this partial, and the tab
     row is told the truth.

     role="alert" on the block, so a swap that arrives while the user is looking
     elsewhere on the page is announced rather than only drawn. It is on the
     card and not on the whole panel: a live region around content that changes
     on every tab would read the entire section aloud each time.

     Try again re-fetches the same URL into the same panel. It is a button in
     the panel rather than a second press on the tab, because the tab is already
     selected and pressing a selected tab is not an action anybody expects to do
     anything. The link beside it is the way out that does not depend on the
     thing that just broke.

     The dot on the tab is server state: it survives moving to another section,
     and the partial that comes back from a successful retry clears it with an
     hx-swap-oob span. Alpine must not own it — the page cannot know whether the
     retry worked. -->
<div data-kui="tabs/retry"
     x-data="{
       tab: 'receipts',
       cursor: 'receipts',
       tabEls() { return Array.from(this.$refs.list.querySelectorAll('[role=tab]')); },
       move(step) {
         const els = this.tabEls();
         const i = els.findIndex(e => e.dataset.tab === this.cursor);
         this.focusTab(els[(i + step + els.length) % els.length]);
       },
       edge(last) { const els = this.tabEls(); this.focusTab(last ? els[els.length - 1] : els[0]); },
       focusTab(el) { if (!el) return; this.cursor = el.dataset.tab; el.focus(); },
       pick(id) { this.tab = id; this.cursor = id; }
     }">
  <div class="border-b border-zinc-200">
    <div x-ref="list" role="tablist" aria-label="Purchase order sections"
         @keydown.arrow-right.prevent="move(1)"
         @keydown.arrow-left.prevent="move(-1)"
         @keydown.home.prevent="edge(false)"
         @keydown.end.prevent="edge(true)"
         class="-mb-px flex gap-6">
      <button type="button" role="tab" data-tab="lines" id="rt-tab-lines" aria-controls="rt-panel"
              :aria-selected="tab === 'lines' ? 'true' : 'false'" :tabindex="cursor === 'lines' ? 0 : -1"
              @click="pick('lines')"
              hx-get="/orders/1187/lines/" hx-target="#rt-panel" hx-swap="innerHTML" hx-indicator="#rt-panel"
              class="shrink-0 rounded-t border-b-2 pb-2.5 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="tab === 'lines' ? 'border-zinc-900 font-semibold text-zinc-900' : 'border-transparent text-zinc-600 hover:text-zinc-900'">Lines</button>
      <button type="button" role="tab" data-tab="receipts" id="rt-tab-receipts" aria-controls="rt-panel"
              :aria-selected="tab === 'receipts' ? 'true' : 'false'" :tabindex="cursor === 'receipts' ? 0 : -1"
              @click="pick('receipts')"
              hx-get="/orders/1187/receipts/" hx-target="#rt-panel" hx-swap="innerHTML" hx-indicator="#rt-panel"
              class="flex shrink-0 items-center gap-2 rounded-t border-b-2 pb-2.5 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="tab === 'receipts' ? 'border-zinc-900 font-semibold text-zinc-900' : 'border-transparent text-zinc-600 hover:text-zinc-900'">
        Receipts
        <span id="rt-flag" class="flex items-center gap-1.5">
          <span class="size-1.5 rounded-full bg-red-600" aria-hidden="true"></span>
          <span class="sr-only">did not load</span>
        </span>
      </button>
      <button type="button" role="tab" data-tab="history" id="rt-tab-history" aria-controls="rt-panel"
              :aria-selected="tab === 'history' ? 'true' : 'false'" :tabindex="cursor === 'history' ? 0 : -1"
              @click="pick('history')"
              hx-get="/orders/1187/history/" hx-target="#rt-panel" hx-swap="innerHTML" hx-indicator="#rt-panel"
              class="shrink-0 rounded-t border-b-2 pb-2.5 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="tab === 'history' ? 'border-zinc-900 font-semibold text-zinc-900' : 'border-transparent text-zinc-600 hover:text-zinc-900'">History</button>
    </div>
  </div>

  <div id="rt-panel" role="tabpanel" tabindex="0" :aria-labelledby="'rt-tab-' + tab"
       class="rounded-lg pt-4 transition-opacity [&.htmx-request]:opacity-40 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
    <div role="alert" class="max-w-md rounded-xl border border-zinc-300 bg-white p-4">
      <div class="flex items-start gap-2.5">
        <i data-lucide="alert-circle" class="mt-0.5 size-4 shrink-0 text-red-600"></i>
        <div class="min-w-0">
          <p class="text-[13px]/5 font-medium">Receipts did not load</p>
          <p class="mt-1 text-[12px]/4 tabular-nums text-zinc-600">The request timed out after 30 seconds. Nothing on the order was changed.</p>
        </div>
      </div>
      <div class="mt-3 flex flex-wrap items-center gap-2 border-t border-zinc-100 pt-3">
        <button type="button"
                hx-get="/orders/1187/receipts/" hx-target="#rt-panel" hx-swap="innerHTML" hx-indicator="#rt-panel"
                class="inline-flex items-center gap-1.5 rounded-lg border border-zinc-200 bg-white px-2.5 py-1.5 text-[12px]/4 font-medium hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
          <i data-lucide="rotate-ccw" class="size-3.5 text-zinc-600"></i>Try again
        </button>
        <a href="/orders/1187/receipts/" class="inline-flex items-center rounded-lg px-2.5 py-1.5 text-[12px]/4 font-medium text-zinc-900 underline underline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
          Open receipts on its own page
        </a>
      </div>
    </div>
  </div>
</div>
