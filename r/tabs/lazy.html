<!-- Manual activation, because each tab is a request. With automatic
     activation, arrowing from the first tab to the fourth fires four fetches
     and the user reads whichever one happens to land last. So the arrows move
     focus only, and Enter or Space commits — which a real <button> already does
     for free, so there is nothing to bind.

     cursor is where focus is, tab is what is showing. Only in automatic
     activation are those the same thing, which is why the other variants can
     get away with one variable.

     The tabs are written out rather than rendered by x-for, and that is not a
     style choice. htmx wires an element when it first processes the document; a
     button created later by Alpine is never processed, so its hx-get is a
     string attribute and the click does nothing at all — no request, no error,
     no clue. Written out, they are in the document htmx reads. It follows that
     the row is walked through the DOM instead of an array, which is the same
     list without a second copy of it in JavaScript.

     The ids are static for the same reason, so they carry a po- prefix of their
     own. Two of these on one page need that prefix changed by hand. -->
<div data-kui="tabs/lazy"
     x-data="{
       tab: 'summary',
       cursor: 'summary',
       tabEls() { return Array.from(this.$refs.list.querySelectorAll('[role=tab]')); },
       move(step) {
         const els = this.tabEls();
         const i = els.findIndex(e => e.dataset.tab === this.cursor);
         this.focusTab(els[(i + step + els.length) % els.length]);
       },
       edge(last) { const els = this.tabEls(); this.focusTab(last ? els[els.length - 1] : els[0]); },
       focusTab(el) { if (!el) return; this.cursor = el.dataset.tab; el.focus(); },
       pick(id) { this.tab = id; this.cursor = id; }
     }">
  <div class="border-b border-zinc-200">
    <div x-ref="list" role="tablist" aria-label="Purchase order sections"
         @keydown.arrow-right.prevent="move(1)"
         @keydown.arrow-left.prevent="move(-1)"
         @keydown.home.prevent="edge(false)"
         @keydown.end.prevent="edge(true)"
         class="-mb-px flex gap-6">
      <button type="button" role="tab" data-tab="summary" id="po-tab-summary" aria-controls="po-panel"
              :aria-selected="tab === 'summary' ? 'true' : 'false'" :tabindex="cursor === 'summary' ? 0 : -1"
              @click="pick('summary')"
              hx-get="/orders/1187/summary/" hx-target="#po-panel" hx-swap="innerHTML" hx-indicator="#po-panel"
              class="shrink-0 rounded-t border-b-2 pb-2.5 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="tab === 'summary' ? 'border-zinc-900 font-semibold text-zinc-900' : 'border-transparent text-zinc-600 hover:text-zinc-900'">Summary</button>
      <button type="button" role="tab" data-tab="lines" id="po-tab-lines" aria-controls="po-panel"
              :aria-selected="tab === 'lines' ? 'true' : 'false'" :tabindex="cursor === 'lines' ? 0 : -1"
              @click="pick('lines')"
              hx-get="/orders/1187/lines/" hx-target="#po-panel" hx-swap="innerHTML" hx-indicator="#po-panel"
              class="shrink-0 rounded-t border-b-2 pb-2.5 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="tab === 'lines' ? 'border-zinc-900 font-semibold text-zinc-900' : 'border-transparent text-zinc-600 hover:text-zinc-900'">Lines</button>
      <button type="button" role="tab" data-tab="receipts" id="po-tab-receipts" aria-controls="po-panel"
              :aria-selected="tab === 'receipts' ? 'true' : 'false'" :tabindex="cursor === 'receipts' ? 0 : -1"
              @click="pick('receipts')"
              hx-get="/orders/1187/receipts/" hx-target="#po-panel" hx-swap="innerHTML" hx-indicator="#po-panel"
              class="shrink-0 rounded-t border-b-2 pb-2.5 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="tab === 'receipts' ? 'border-zinc-900 font-semibold text-zinc-900' : 'border-transparent text-zinc-600 hover:text-zinc-900'">Receipts</button>
      <button type="button" role="tab" data-tab="history" id="po-tab-history" aria-controls="po-panel"
              :aria-selected="tab === 'history' ? 'true' : 'false'" :tabindex="cursor === 'history' ? 0 : -1"
              @click="pick('history')"
              hx-get="/orders/1187/history/" hx-target="#po-panel" hx-swap="innerHTML" hx-indicator="#po-panel"
              class="shrink-0 rounded-t border-b-2 pb-2.5 text-[13px]/5 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="tab === 'history' ? 'border-zinc-900 font-semibold text-zinc-900' : 'border-transparent text-zinc-600 hover:text-zinc-900'">History</button>
    </div>
  </div>

  <!-- hx-indicator puts .htmx-request on this panel for the length of the
       request, which is enough to fade it without any custom CSS -->
  <div id="po-panel" role="tabpanel" tabindex="0" :aria-labelledby="'po-tab-' + tab" aria-live="polite"
       class="rounded-lg pt-4 text-[14px]/5 transition-opacity [&.htmx-request]:opacity-40 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
    <p class="text-zinc-600">Summary renders with the page. Every other tab is fetched from
      <code class="rounded bg-zinc-200 px-1.5 py-0.5 font-mono text-[12px]/4">/orders/1187/&lt;tab&gt;/</code>
      and swapped in here.</p>
  </div>
</div>
