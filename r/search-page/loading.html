<!-- The facets are drawn and the results are not, because those two things are
     known at different times. The facet list is very nearly the same rail on
     every query — the same five record types, the same two plants, the same
     five statuses — so drawing it costs nothing and lets somebody decide where
     they are going to look before the answer arrives. The counts are the part
     that belongs to this query, and they are blank rather than stale: last
     query's 186 sitting beside this query's box is wrong in a way nobody can
     see.

     The results are a flat run of grey rows with no headings over them, and
     that is the decision worth recording. Drawing three headings with rows
     under them promises a grouping the answer will probably not have — this
     query may come back as one group of four hundred or as five groups of
     three — and a skeleton that reflows on arrival is worse than a spinner,
     because a spinner never promised a layout. What is honest here is the row
     shape, which every group shares, and the row count, which is the page size
     the request asked for.

     The controls stay live while the counts are missing. The values are the
     same set on every query, so ticking one is a well-formed request; it is
     only the number beside it that is not known yet. Disabling the rail would
     make the wait longer for the one person who already knew what they wanted.

     One status line, and it is the count line that is on the page in every
     other state. A second sr-only region announcing the wait talks over it, and
     a region that arrives with its message already in it announces nothing at
     all — this one was in the document before the query was sent and its text
     is what changes.

     aria-busy goes on the results column and survives the swap, aria-hidden
     goes on the pulse wrapper so one attribute hides every block, and the
     status sits outside both. Three jobs, and collapsing any two loses one. -->

  <main>

            <i data-lucide="search" aria-hidden="true" class="ml-3 size-4 shrink-0 text-zinc-600"></i>
            <input id="sp-lo-q" value="MS-4821" type="search" enterkeyhint="search"
                   autocomplete="off" spellcheck="false" autocapitalize="none"
                   class="w-full min-w-0 bg-transparent px-2 py-2 text-[14px]/5 outline-none placeholder:text-zinc-500 [&amp;::-webkit-search-cancel-button]:appearance-none">

              <i data-lucide="loader-circle" class="size-4 animate-spin text-zinc-600"></i>
