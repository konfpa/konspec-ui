<!-- A filtered schedule is a schedule of lies unless every figure says so, and
     on this layout the lie is worse than on a register: an empty Wednesday is
     the answer somebody books a truck against. So a day that is hiding
     something says how many, in the cell, next to the blocks it is showing.
     Dropping the count and leaving the day looking free is how a plant promises
     against a day that already has three trucks on it.

     Every count on screen goes to n of m while any chip is set — the scope line
     under the title, the count on each day header — and they revert to the
     plain figure when the last chip goes, because "3 of 3" on an unfiltered
     week trains people to ignore the qualifier on the day it means something.

     The chips are board's and empty-state's unchanged: removable one at a time
     on a bg-zinc-50 band, Clear all as a link rather than a second filled
     button. Clearing them all deletes the control that did it, so the handler
     moves focus to the scope line, which is tabindex="-1" for exactly that and
     is also the sentence saying what happened.

     Filtering never moves a block and never changes a date. A delivery the
     filter excludes is not on another day; it is not on the screen.

     The week is a grid of day cards rather than a table here, because a filter
     bar plus seven columns at 390px is the width where a table stops reflowing
     and starts scrolling. Two columns on a phone, four at sm, seven at lg, and
     nothing moves sideways at any of them. -->
<main data-kui="schedule-page/filters" class="h-[640px] overflow-y-auto rounded-xl border border-zinc-300 bg-zinc-100 text-zinc-900"
      x-data="{
        chips: ['Silvassa', 'Gujarat Polymers Ltd'],
        days: [
          { name: 'Mon', n: 17, off: false, note: '' },
          { name: 'Tue', n: 18, off: false, note: '' },
          { name: 'Wed', n: 19, off: false, note: '' },
          { name: 'Thu', n: 20, off: false, note: '' },
          { name: 'Fri', n: 21, off: true, note: 'Plant shut — annual maintenance' },
          { name: 'Sat', n: 22, off: false, note: '' },
          { name: 'Sun', n: 23, off: true, note: 'Weekly off' }
        ],
        blocks: [
          { n: 17, no: 'PO-2026-0424', vendor: 'Konkan Packaging Co', tone: 'bg-amber-500', state: 'awaiting approval', hit: false },
          { n: 18, no: 'PO-2026-0427', vendor: 'Sharma Steel &amp; Alloys', tone: 'bg-zinc-500', state: 'open', hit: false },
          { n: 18, no: 'PO-2026-0430', vendor: 'Deccan Fasteners Pvt Ltd', tone: 'bg-zinc-500', state: 'open', hit: false },
          { n: 18, no: 'PO-2026-0433', vendor: 'Gujarat Polymers Ltd', tone: 'bg-amber-500', state: 'awaiting approval', hit: true },
          { n: 19, no: 'PO-2026-0436', vendor: 'Konkan Packaging Co', tone: 'bg-zinc-500', state: 'open', hit: false },
          { n: 20, no: 'PO-2026-0439', vendor: 'Gujarat Polymers Ltd', tone: 'bg-zinc-500', state: 'open', hit: true },
          { n: 20, no: 'PO-2026-0442', vendor: 'Qureshi Metals', tone: 'bg-red-600', state: 'overdue', hit: false },
          { n: 22, no: 'PO-2026-0448', vendor: 'Gujarat Polymers Ltd', tone: 'bg-zinc-500', state: 'open', hit: true }
        ],
        all(n) { return this.blocks.filter(b => b.n === n) },
        at(n) { return this.all(n).filter(b => this.chips.length ? b.hit : true) },
        hidden(n) { return this.all(n).length - this.at(n).length },
        count(n) { return this.chips.length ? this.at(n).length + ' of ' + this.all(n).length : String(this.all(n).length) },
        get on() { return this.chips.length ? this.blocks.filter(b => b.hit).length : this.blocks.length },
        get total() { return this.blocks.length },
        clearAll() { this.chips = []; this.$nextTick(() => this.$refs.count.focus()) }
      }">

  <header class="border-b border-zinc-200 bg-white">
    <div class="mx-auto max-w-[1600px] px-4 py-4 lg:px-6">
      <div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-3">
        <div class="min-w-0">
          <h1 class="text-[24px]/7 font-semibold tracking-tight">Delivery schedule</h1>
          <p role="status" x-ref="count" tabindex="-1"
             class="mt-1 text-[13px]/5 tabular-nums text-zinc-600 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
             x-text="chips.length ? on + ' of ' + total + ' deliveries shown this week · ' + (total - on) + ' hidden by ' + chips.length + ' filters' : total + ' deliveries promised this week'"></p>
        </div>
        <button type="button" class="flex shrink-0 items-center gap-2 rounded-lg bg-zinc-700 px-3.5 py-2 text-[13px]/5 font-medium text-white hover:bg-zinc-800 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
          <i data-lucide="plus" class="size-4"></i>Promise a date
        </button>
      </div>

      <form role="search" @submit.prevent class="mt-4 flex flex-col gap-2 md:flex-row md:items-center">
        <div class="md:max-w-xs md:flex-1">
          <label for="sfl-q" class="sr-only">Filter the week by order number or vendor</label>
          <div class="flex items-center rounded-lg border border-zinc-200 bg-white focus-within:border-zinc-700 focus-within:outline-3 focus-within:outline-offset-2 focus-within:outline-zinc-700/15">
            <i data-lucide="search" class="ml-3 size-4 shrink-0 text-zinc-600"></i>
            <input id="sfl-q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false"
                   placeholder="Filter by order or vendor"
                   class="w-full min-w-0 bg-transparent px-2 py-2 text-[13px]/5 outline-none placeholder:text-zinc-500">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2 md:flex md:shrink-0">
          <div class="min-w-0">
            <label for="sfl-plant" class="sr-only">Plant</label>
            <select id="sfl-plant"
                    class="w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-[13px]/5 font-medium focus:border-zinc-700 focus:outline-3 focus:outline-offset-2 focus:outline-zinc-700/15 md:w-auto">
              <option value="silvassa" selected>Plant: Silvassa</option>
              <option value="">Plant: all</option>
              <option value="vapi">Plant: Vapi</option>
            </select>
          </div>
          <div class="min-w-0">
            <label for="sfl-vendor" class="sr-only">Vendor</label>
            <select id="sfl-vendor"
                    class="w-full rounded-lg border border-zinc-200 bg-white px-3 py-2 text-[13px]/5 font-medium focus:border-zinc-700 focus:outline-3 focus:outline-offset-2 focus:outline-zinc-700/15 md:w-auto">
              <option value="gpl" selected>Vendor: Gujarat Polymers Ltd</option>
              <option value="">Vendor: all</option>
              <option value="sharma">Vendor: Sharma Steel &amp; Alloys</option>
              <option value="deccan">Vendor: Deccan Fasteners Pvt Ltd</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <div x-show="chips.length" class="flex flex-wrap items-center gap-2 border-t border-zinc-200 bg-zinc-50 px-4 py-2 lg:px-6">
      <template x-for="f in chips" :key="f">
        <span class="inline-flex items-center gap-1.5 rounded-full bg-zinc-200 py-0.5 pr-1 pl-2.5 text-[12px]/4 font-medium text-zinc-700 ring-1 ring-inset ring-zinc-300">
          <span x-text="f"></span>
          <button type="button" @click="chips = chips.filter(x => x !== f)" :aria-label="'Remove the filter ' + f"
                  class="flex size-4 items-center justify-center rounded-full text-zinc-600 hover:bg-zinc-300 hover:text-zinc-900 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
            <i data-lucide="x" class="size-3"></i>
          </button>
        </span>
      </template>
      <button type="button" @click="clearAll()"
              class="text-[12px]/4 font-medium text-zinc-900 underline underline-offset-2 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
        Clear all
      </button>
    </div>
  </header>

  <div class="mx-auto max-w-[1600px] px-4 py-5 lg:px-6">
    <section aria-labelledby="sfl-h">
      <h2 id="sfl-h" class="sr-only">Deliveries promised, 17 to 23 August 2026</h2>

      <ul role="list" class="grid grid-cols-2 gap-3 sm:grid-cols-4 lg:grid-cols-7">
        <template x-for="d in days" :key="d.n">
          <li class="overflow-hidden rounded-xl border border-zinc-300" :class="d.off ? 'bg-zinc-50' : 'bg-white'">
            <div class="flex items-baseline justify-between gap-2 border-b border-zinc-200 px-2.5 py-2">
              <h3 class="text-[12px]/4 font-medium tabular-nums" :class="d.off ? 'text-zinc-500' : 'text-zinc-900'"
                  x-text="d.name + ' ' + d.n"></h3>
              <span x-show="!d.off" class="shrink-0 text-[12px]/4 tabular-nums text-zinc-500" x-text="count(d.n)"></span>
            </div>

            <div class="min-h-32 px-2 py-2">
              <p x-show="d.off" x-cloak class="text-[11px]/4 text-zinc-600" x-text="d.note"></p>

              <ul role="list" class="space-y-1.5">
                <template x-for="b in (d.off ? [] : at(d.n))" :key="b.no">
                  <li>
                    <a href="#" class="block overflow-hidden rounded-md bg-zinc-200 px-2 py-1.5 ring-1 ring-inset ring-zinc-300 hover:bg-zinc-300 focus-visible:outline-3 focus-visible:-outline-offset-2 focus-visible:outline-zinc-700/15">
                      <span class="flex items-center gap-1.5">
                        <span class="size-1.5 shrink-0 rounded-full" :class="b.tone" aria-hidden="true"></span>
                        <span class="truncate text-[12px]/4 font-medium tabular-nums text-zinc-700" x-text="b.no"></span>
                      </span>
                      <span class="mt-0.5 block truncate text-[11px]/4 text-zinc-600" x-text="b.vendor"></span>
                      <span class="sr-only" x-text="', promised ' + d.name + ' ' + d.n + ' August 2026, ' + b.state"></span>
                    </a>
                  </li>
                </template>
              </ul>

              <!-- The count of what this day is not showing. Without it a day
                   holding three deliveries and drawing one reads as a day with
                   one delivery on it, and the schedule has told a lie about
                   the only thing it exists to say. -->
              <p x-show="!d.off &amp;&amp; hidden(d.n)" x-cloak
                 class="mt-1.5 text-[11px]/4 tabular-nums text-zinc-500"
                 x-text="hidden(d.n) + ' hidden by the filters'"></p>

              <p x-show="!d.off &amp;&amp; !all(d.n).length" x-cloak class="text-[11px]/4 text-zinc-500">Nothing promised</p>
            </div>
          </li>
        </template>
      </ul>
    </section>
  </div>
</main>
