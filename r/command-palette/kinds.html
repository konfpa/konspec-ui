<!-- Type 1187 into a procurement console and five different records answer:
     the purchase order, the goods receipt booked against a different order,
     the vendor code, the invoice and the item. They go to five screens, and
     which one somebody wanted is not something the palette can guess.

     So this variant ranks them into one list instead of grouping them by kind.
     A grouped list puts the best match under whichever heading it belongs to,
     four rows down, while an exact hit on a vendor code sits alone at the top
     under Vendors — the ranking is the answer to the query and the grouping
     hides it. The cost is that there is no heading over the row saying what it
     is, so the kind has to ride on the row.

     It rides as a word. The icons are the same 16px document glyph for an
     order and an invoice, and an icon is not an accessible name either: the
     chip is text inside the option, so the row is announced as "PO-24-1187,
     Gujarat Polymers Ltd, Purchase order".

     The score is four steps — the code is the query, the code starts with it,
     the code contains it, the name starts with it — and the tiebreak is the
     original index. Without that tiebreak two rows that score the same swap
     places between keystrokes, the row moves out from under the pointer, and
     Enter takes a record nobody chose.

     Nothing is highlighted inside the matched text. Marking it needs a fill
     behind the characters, which is a field of colour behind text and not
     something this system has; the ranking carries the same information by
     putting the exact hit first. -->
<div data-kui="command-palette/kinds" x-data="{
       open: false, q: '', ai: 0,
       items: [
         { id: 'po-1187',  code: 'PO-24-1187', kind: 'Purchase order', label: 'Gujarat Polymers Ltd',      sub: 'HDPE granules · 14 lines · open',        right: '₹18,42,000', icon: 'file-text' },
         { id: 'grn-1187', code: 'GRN-1187',   kind: 'Goods receipt',  label: 'Sharma Steel Traders',      sub: 'Against PO-24-1102 · posted 04 Sep 2026', right: '12.400 MT',  icon: 'package-check' },
         { id: 'ven-1187', code: 'VEN-1187',   kind: 'Vendor',         label: 'Baroda Fasteners',          sub: 'Nashik · rate contract to 31 Mar 2027',                       icon: 'building-2' },
         { id: 'inv-1187', code: 'INV-1187',   kind: 'Vendor invoice', label: 'Deccan Fasteners Pvt Ltd',  sub: 'Booked 28 Aug 2026 · 2 of 3 matched',    right: '₹2,74,900',  icon: 'receipt' },
         { id: 'itm-1187', code: 'ITM-1187',   kind: 'Item',           label: 'HDPE granules, natural',    sub: 'HSN 39012000 · 4,200 kg on hand',                             icon: 'box' },
         { id: 'po-1206',  code: 'PO-24-1206', kind: 'Purchase order', label: 'Konkan Chemicals Pvt Ltd',  sub: 'Caustic soda lye · 8 lines · open',      right: '₹6,18,400',  icon: 'file-text' },
         { id: 'new-po',                       kind: 'Action',         label: 'New purchase order',        sub: 'Opens an empty order in Operations',                          icon: 'plus' },
         { id: 'find-grn',                     kind: 'Action',         label: 'Goods receipts register',   sub: 'Every GRN posted this month',                                 icon: 'list-filter' }
       ],
       score(o, s) {
         const code = (o.code || '').toLowerCase(), label = o.label.toLowerCase();
         if (code === s) return 0;
         if (code.startsWith(s)) return 1;
         if (code.includes(s)) return 2;
         if (label.startsWith(s)) return 3;
         return 4;
       },
       get list() {
         const s = this.q.trim().toLowerCase();
         if (!s) return this.items;
         return this.items
           .map((o, i) => ({ o: o, i: i, r: this.score(o, s) }))
           .filter(x => ((x.o.code || '') + ' ' + x.o.kind + ' ' + x.o.label + ' ' + x.o.sub).toLowerCase().includes(s))
           .sort((a, b) => a.r - b.r || a.i - b.i)
           .map(x => x.o);
       },
       rowId(o) { return 'cpk-' + o.id; },
       get activeId() { return this.open && this.list[this.ai] ? this.rowId(this.list[this.ai]) : null; },
       scroll() { this.$nextTick(() => { const el = document.getElementById(this.activeId); if (el) el.scrollIntoView({ block: 'nearest' }); }); },
       show() { this.open = true; this.q = ''; this.ai = 0; },
       hide() { this.open = false; this.q = ''; this.ai = 0; },
       move(n) {
         if (!this.list.length) return;
         this.ai = Math.min(this.list.length - 1, Math.max(0, this.ai + n));
         this.scroll();
       },
       pick(o) { this.hide(); },
       commit() { const o = this.list[this.ai]; if (o) this.pick(o); }
     }"
     @keydown.window.meta.k.prevent="show()"
     @keydown.window.ctrl.k.prevent="show()"
     @keydown.escape.window="hide()">

  <button type="button" @click="show()" aria-haspopup="dialog"
          class="flex w-full max-w-sm items-center gap-2 rounded-lg border border-zinc-200 bg-white px-3 py-2 text-[13px]/5 text-zinc-500 hover:bg-zinc-200 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
    <i data-lucide="search" class="size-4 text-zinc-600"></i>
    <span class="flex-1 text-left">Search Operations</span>
    <kbd aria-hidden="true" class="rounded border border-zinc-200 px-1.5 py-0.5 text-[11px]/4">⌘K</kbd>
  </button>

  <div x-show="open" x-cloak x-trap.noscroll="open"
       class="fixed inset-0 z-50 flex items-start justify-center bg-zinc-900/40 px-3 pt-16 sm:pt-24">
    <div role="dialog" aria-modal="true" aria-label="Command palette" @click.outside="hide()"
         class="w-full max-w-xl overflow-hidden rounded-xl border border-zinc-300 bg-white shadow-lg">

      <div class="flex items-center gap-2 border-b border-zinc-100 px-3">
        <i data-lucide="search" class="size-4 shrink-0 text-zinc-600"></i>
        <label for="cpk-q" class="sr-only">Search orders, receipts, invoices, vendors and items</label>
        <input id="cpk-q" x-model="q" type="text" role="combobox" autocomplete="off" autofocus
               aria-autocomplete="list" aria-controls="cpk-list"
               :aria-expanded="open" :aria-activedescendant="activeId"
               placeholder="Search a number — 1187 — or a name"
               @input="ai = 0"
               @keydown.arrow-down.prevent="move(1)"
               @keydown.arrow-up.prevent="move(-1)"
               @keydown.enter.prevent="commit()"
               class="w-full min-w-0 bg-transparent py-3 text-[14px]/5 outline-none placeholder:text-zinc-500">
        <button type="button" @click="hide()" class="rounded border border-zinc-200 bg-white px-1.5 py-0.5 text-[11px]/4 text-zinc-500 hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Esc</button>
      </div>

      <!-- one flat listbox, no groups: the order of the rows is the answer, so
           there is nothing to divide them into -->
      <div id="cpk-list" role="listbox" aria-label="Results, best match first" class="max-h-80 overflow-y-auto py-1">
        <template x-for="(o, i) in list" :key="o.id">
          <div :id="rowId(o)" role="option"
               @mousedown.prevent @click="pick(o)" @mousemove="ai = i"
               :class="i === ai ? 'bg-zinc-100' : ''"
               class="flex items-center gap-2.5 px-3 py-2 text-[13px]/5">
            <span class="flex size-4 shrink-0 items-center justify-center text-zinc-600">
              <i :data-lucide="o.icon" class="size-4"></i>
            </span>
            <span class="min-w-0 flex-1">
              <!-- an action has no number, so the row is the label alone -->
              <span class="block truncate"><span x-show="o.code" class="font-medium tabular-nums"><span x-text="o.code"></span> · </span><span x-text="o.label"></span></span>
              <span class="block truncate text-[12px]/4 tabular-nums text-zinc-500" x-text="o.sub"></span>
            </span>
            <span x-show="o.right" class="hidden shrink-0 text-[12px]/4 tabular-nums text-zinc-600 sm:block" x-text="o.right"></span>
            <!-- the kind, as text inside the option, so it is part of the name
                 the row is announced with and not only a glyph -->
            <span class="shrink-0 rounded-full bg-zinc-200 px-2 py-0.5 text-[11px]/4 text-zinc-700 ring-1 ring-inset ring-zinc-300" x-text="o.kind"></span>
          </div>
        </template>
      </div>

      <div x-show="!list.length" x-cloak class="px-4 py-6 text-center">
        <p class="text-[13px]/5 font-medium">Nothing matches “<span x-text="q"></span>”</p>
        <p class="mt-1 text-[12px]/4 tabular-nums text-zinc-500">Search the number without its prefix — 1187 rather than PO-24-1187.</p>
      </div>

      <div class="flex items-center gap-3 border-t border-zinc-100 px-3 py-2 text-[11px]/4 text-zinc-500">
        <span><kbd class="rounded border border-zinc-200 px-1 py-0.5">↑↓</kbd> move</span>
        <span><kbd class="rounded border border-zinc-200 px-1 py-0.5">↵</kbd> open</span>
        <span class="ml-auto">Orders · Receipts · Invoices · Vendors · Items</span>
      </div>

      <p role="status" class="sr-only"
         x-text="open ? (list.length === 1 ? '1 result' : list.length + ' results') : ''"></p>
    </div>
  </div>
</div>
