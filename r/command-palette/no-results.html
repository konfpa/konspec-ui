<!-- The palette searches numbers, names and codes. It does not search the
     text of a line item, a note or an attachment, and somebody looking for
     "gasket 12mm" has no way of knowing that from a panel that has gone
     blank. An empty panel is also the exact shape of a component that broke.

     So zero matches is not an empty state, it is a shorter list. The two rows
     under it are the searches the palette cannot run itself — the order
     register's own full-text filter, and the item master — and they are
     ordinary role="option" rows, which is the whole point: Enter is already
     under the user's finger, the highlight is already on the first row, and
     the query is already typed. A pair of buttons here instead would be two
     tab stops inside a widget that has none, and reaching them would mean
     leaving the search box.

     The line saying what was searched sits outside the listbox. A paragraph is
     not a permitted child of one, and it is not a row: there is nothing to
     press on it.

     Every fallback carries the query in its own label rather than a bare
     "search everywhere", so the row says what it will do with the words
     already typed. The count comes with it — 1,284 orders — because "search
     all orders" is a different offer at twelve orders and at twelve
     thousand. -->
<div data-kui="command-palette/no-results" x-data="{
       open: false, q: 'gasket 12mm', ai: 0,
       records: [
         { id: 'po-1187', label: 'PO-24-1187 — Gujarat Polymers Ltd', sub: 'HDPE granules · 14 lines', amount: '₹18,42,000', icon: 'file-text' },
         { id: 'po-1206', label: 'PO-24-1206 — Konkan Chemicals Pvt Ltd', sub: 'Caustic soda lye · 8 lines', amount: '₹6,18,400', icon: 'file-text' },
         { id: 'ven-deccan', label: 'Deccan Fasteners Pvt Ltd', sub: 'Vendor · rate contract to 31 March 2027', icon: 'building-2' }
       ],
       get matches() {
         const s = this.q.trim().toLowerCase();
         if (!s) return this.records;
         return this.records.filter(o => (o.label + ' ' + (o.sub || '')).toLowerCase().includes(s));
       },
       get fallbacks() {
         return [
           { id: 'in-orders', label: 'Search 1,284 purchase orders for', icon: 'list-filter', sub: 'Line items, notes and attachments — the register\'s own filter' },
           { id: 'in-items',  label: 'Search the item master for',       icon: 'box',         sub: '9,412 items by description, HSN code and specification' }
         ];
       },
       get empty() { return !!this.q.trim() && !this.matches.length; },
       get list() { return this.empty ? this.fallbacks : this.matches; },
       rowId(o) { return 'cpn-' + o.id; },
       get activeId() { return this.open && this.list[this.ai] ? this.rowId(this.list[this.ai]) : null; },
       scroll() { this.$nextTick(() => { const el = document.getElementById(this.activeId); if (el) el.scrollIntoView({ block: 'nearest' }); }); },
       show() { this.open = true; this.ai = 0; },
       hide() { this.open = false; this.q = ''; this.ai = 0; },
       move(n) {
         if (!this.list.length) return;
         this.ai = Math.min(this.list.length - 1, Math.max(0, this.ai + n));
         this.scroll();
       },
       pick(o) { this.hide(); },
       commit() { const o = this.list[this.ai]; if (o) this.pick(o); }
     }"
     @keydown.window.meta.k.prevent="show()"
     @keydown.window.ctrl.k.prevent="show()"
     @keydown.escape.window="hide()">

  <button type="button" @click="show()" aria-haspopup="dialog"
          class="flex w-full max-w-sm items-center gap-2 rounded-lg border border-zinc-200 bg-white px-3 py-2 text-[13px]/5 text-zinc-500 hover:bg-zinc-200 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">
    <i data-lucide="search" class="size-4 text-zinc-600"></i>
    <span class="flex-1 text-left">Search Operations</span>
    <kbd aria-hidden="true" class="rounded border border-zinc-200 px-1.5 py-0.5 text-[11px]/4">⌘K</kbd>
  </button>

  <div x-show="open" x-cloak x-trap.noscroll="open"
       class="fixed inset-0 z-50 flex items-start justify-center bg-zinc-900/40 px-3 pt-16 sm:pt-24">
    <div role="dialog" aria-modal="true" aria-label="Command palette" @click.outside="hide()"
         class="w-full max-w-xl overflow-hidden rounded-xl border border-zinc-300 bg-white shadow-lg">

      <div class="flex items-center gap-2 border-b border-zinc-100 px-3">
        <i data-lucide="search" class="size-4 shrink-0 text-zinc-600"></i>
        <label for="cpn-q" class="sr-only">Search orders, vendors and actions</label>
        <input id="cpn-q" x-model="q" type="text" role="combobox" autocomplete="off" autofocus
               aria-autocomplete="list" aria-controls="cpn-list"
               :aria-expanded="open" :aria-activedescendant="activeId"
               placeholder="Search orders, vendors, actions…"
               @input="ai = 0"
               @keydown.arrow-down.prevent="move(1)"
               @keydown.arrow-up.prevent="move(-1)"
               @keydown.enter.prevent="commit()"
               class="w-full min-w-0 bg-transparent py-3 text-[14px]/5 outline-none placeholder:text-zinc-500">
        <button type="button" @click="hide()" class="rounded border border-zinc-200 bg-white px-1.5 py-0.5 text-[11px]/4 text-zinc-500 hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Esc</button>
      </div>

      <!-- outside the listbox: a paragraph is not a permitted child of one,
           and this is the only part of the panel that is not a row -->
      <div x-show="empty" x-cloak class="border-b border-zinc-100 px-3 py-3">
        <p class="text-[13px]/5 font-medium">No order, vendor or item is called “<span x-text="q"></span>”</p>
        <p class="mt-0.5 text-[12px]/4 tabular-nums text-zinc-500">The palette searches numbers, names and codes only.</p>
      </div>

      <div id="cpn-list" role="listbox" :aria-label="empty ? 'Other places to search' : 'Results'" class="max-h-80 overflow-y-auto py-1">
        <template x-for="(o, i) in list" :key="o.id">
          <div :id="rowId(o)" role="option"
               @mousedown.prevent @click="pick(o)" @mousemove="ai = i"
               :class="i === ai ? 'bg-zinc-100' : ''"
               class="flex items-start gap-2.5 px-3 py-2 text-[13px]/5">
            <span class="mt-0.5 flex size-4 shrink-0 items-center justify-center text-zinc-600">
              <i :data-lucide="o.icon" class="size-4"></i>
            </span>
            <span class="min-w-0 flex-1">
              <!-- the query is inside the row's own label, so the row says
                   what it will do with the words already typed -->
              <span class="block truncate tabular-nums"><span x-text="o.label"></span><span x-show="empty" class="font-medium"> “<span x-text="q"></span>”</span></span>
              <span x-show="o.sub" class="block truncate text-[12px]/4 tabular-nums text-zinc-500" x-text="o.sub"></span>
            </span>
            <span x-show="o.amount" class="mt-0.5 hidden shrink-0 text-[12px]/4 tabular-nums text-zinc-600 sm:block" x-text="o.amount"></span>
            <span x-show="empty" class="mt-0.5 flex size-4 shrink-0 items-center justify-center text-zinc-500">
              <i data-lucide="arrow-right" class="size-4"></i>
            </span>
          </div>
        </template>
      </div>

      <div class="flex items-center gap-3 border-t border-zinc-100 px-3 py-2 text-[11px]/4 text-zinc-500">
        <span><kbd class="rounded border border-zinc-200 px-1 py-0.5">↑↓</kbd> move</span>
        <span><kbd class="rounded border border-zinc-200 px-1 py-0.5">↵</kbd> <span x-text="empty ? 'search there' : 'open'">search there</span></span>
        <span class="ml-auto">Operations</span>
      </div>

      <p role="status" class="sr-only"
         x-text="open ? (empty ? 'Nothing matched. Two other places to search.' : (list.length === 1 ? '1 result' : list.length + ' results')) : ''"></p>
    </div>
  </div>
</div>
