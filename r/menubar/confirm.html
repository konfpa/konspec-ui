<!-- Void order voids nothing on the press. It closes the menu, hands focus
     back to the File trigger, and only then raises the dialog — and that order
     is the whole variant. x-trap captures document.activeElement at the moment
     it activates, so if the dialog goes up while focus is still on the menu
     item x-show is about to hide, the trap memorises a node that is about to be
     undisplayed and Keep the order restores focus to nothing: the caret lands
     on <body> and the next Tab restarts at the top of the document.

     ask() is close() followed by the flag for exactly that reason. close() is
     also what leaves the bar's roving tabindex on File, so the dialog closes
     onto a bar whose one tab stop is the menu the command came out of. Set the
     flag without it and the tab stop is wherever it was before — the same bug
     from the other end, and the end nobody notices.

     The bar's Escape handler is guarded on open !== null, and this is the
     variant that shows why the guard is not defensive coding. By the time the
     dialog is up the menu is closed, the guard is false, and Escape reaches the
     dialog's own .window handler. Bind Escape unconditionally on the bar and
     the dialog cannot be dismissed from the keyboard at all.

     The dialog is a descendant of the bar's root, so @click.outside never reads
     a click on the backdrop as a click outside and the menu cannot close itself
     out from under the question it asked.

     The consequence is in figures and the button carries the verb. A dialog
     whose buttons are Confirm and Cancel has to be read twice to be answered
     once, and the second read is the one people skip. -->
<div data-kui="menubar/confirm" class="rounded-xl border border-zinc-300 bg-white"
     x-data="{
       open: null, at: 'file', typed: '', clock: null, voiding: false,
       trigs() { return [...this.$refs.bar.querySelectorAll('[data-menu]')] },
       items() {
         const p = this.$refs.bar.querySelector('[data-panel=' + this.open + ']');
         return p ? [...p.querySelectorAll('[role^=menuitem]')] : [];
       },
       to(id) {
         this.at = id;
         this.trigs().find(t => t.dataset.menu === id)?.focus();
         if (this.open !== null) this.open = id;
       },
       show(id, last = false) {
         this.open = id; this.at = id;
         this.$nextTick(() => requestAnimationFrame(() => {
           const i = this.items(); (last ? i[i.length - 1] : i[0])?.focus();
         }));
       },
       close(back = true) {
         if (this.open === null) return;
         const id = this.open; this.open = null;
         if (back) this.to(id);
       },
       ask() { this.close(); this.voiding = true },
       step(n) {
         const t = this.trigs(), i = t.findIndex(e => e.dataset.menu === this.at);
         this.to(t[(i + n + t.length) % t.length].dataset.menu);
       },
       jump(last) { const t = this.trigs(); this.to((last ? t[t.length - 1] : t[0]).dataset.menu) },
       move(n) { const i = this.items(), a = i.indexOf(document.activeElement); i[(a + n + i.length) % i.length]?.focus() },
       edge(last) { const i = this.items(); (last ? i[i.length - 1] : i[0])?.focus() },
       type(e) {
         if (!e.target.dataset.menu || e.key === ' ' || e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
         clearTimeout(this.clock);
         this.typed += e.key.toLowerCase();
         this.clock = setTimeout(() => { this.typed = '' }, 500);
         const t = this.trigs().find(x => x.textContent.trim().toLowerCase().startsWith(this.typed));
         if (t) { e.preventDefault(); this.to(t.dataset.menu) }
       }
     }"
     @click.outside="close(false)"
     @keydown="type($event)"
     @keydown.escape="if (open !== null) { $event.stopPropagation(); close() }">

  <div x-ref="bar" role="menubar" aria-label="Purchase order commands"
       class="relative flex items-center gap-0.5 border-b border-zinc-100 px-1 py-1">

    <div class="relative max-md:static">
      <button type="button" role="menuitem" aria-haspopup="menu" data-menu="file"
              :aria-expanded="open === 'file'" :tabindex="at === 'file' ? 0 : -1"
              @click="open === 'file' ? close() : show('file')"
              @mouseenter="if (open !== null) to('file')"
              @keydown.arrow-down.prevent="show('file')" @keydown.arrow-up.prevent="show('file', true)"
              @keydown.arrow-right.prevent="step(1)" @keydown.arrow-left.prevent="step(-1)"
              @keydown.home.prevent="jump(false)" @keydown.end.prevent="jump(true)"
              class="rounded-lg px-2.5 py-1.5 text-[13px]/5 font-medium text-zinc-700 hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="open === 'file' && 'bg-zinc-200 text-zinc-900 hover:bg-zinc-300'">File</button>

      <div x-show="open === 'file'" x-cloak data-panel="file" role="menu" aria-label="File"
           @keydown.arrow-down.prevent="move(1)" @keydown.arrow-up.prevent="move(-1)"
           @keydown.home.prevent="edge(false)" @keydown.end.prevent="edge(true)"
           @keydown.arrow-right.prevent="step(1)" @keydown.arrow-left.prevent="step(-1)"
           @keydown.tab="close()"
           class="absolute top-full left-0 z-40 mt-1 w-64 max-w-[calc(100vw-2rem)] rounded-xl border border-zinc-200 bg-white py-1 shadow-lg">
        <button type="button" role="menuitem" tabindex="-1" aria-keyshortcuts="Control+S" @click="close()"
                class="flex w-full items-center gap-2.5 px-3 py-2 text-left text-[13px]/5 hover:bg-zinc-100 focus:bg-zinc-100 focus:outline-2 focus:-outline-offset-2 focus:outline-zinc-700">
          <i data-lucide="save" class="size-4 text-zinc-600"></i>Save draft
          <span aria-hidden="true" class="ml-auto shrink-0 pl-6 text-[12px]/4 text-zinc-500">Ctrl S</span>
        </button>
        <button type="button" role="menuitem" tabindex="-1" @click="close()"
                class="flex w-full items-center gap-2.5 px-3 py-2 text-left text-[13px]/5 hover:bg-zinc-100 focus:bg-zinc-100 focus:outline-2 focus:-outline-offset-2 focus:outline-zinc-700">
          <i data-lucide="printer" class="size-4 text-zinc-600"></i>Print
        </button>

        <div role="separator" class="my-1 h-px bg-zinc-100"></div>

        <button type="button" role="menuitem" tabindex="-1" @click="ask()"
                class="flex w-full items-center gap-2.5 px-3 py-2 text-left text-[13px]/5 text-red-600 hover:bg-zinc-100 focus:bg-zinc-100 focus:outline-2 focus:-outline-offset-2 focus:outline-zinc-700">
          <i data-lucide="ban" class="size-4"></i>Void order
        </button>
      </div>
    </div>

    <div class="relative max-md:static">
      <button type="button" role="menuitem" aria-haspopup="menu" data-menu="edit"
              :aria-expanded="open === 'edit'" :tabindex="at === 'edit' ? 0 : -1"
              @click="open === 'edit' ? close() : show('edit')"
              @mouseenter="if (open !== null) to('edit')"
              @keydown.arrow-down.prevent="show('edit')" @keydown.arrow-up.prevent="show('edit', true)"
              @keydown.arrow-right.prevent="step(1)" @keydown.arrow-left.prevent="step(-1)"
              @keydown.home.prevent="jump(false)" @keydown.end.prevent="jump(true)"
              class="rounded-lg px-2.5 py-1.5 text-[13px]/5 font-medium text-zinc-700 hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15"
              :class="open === 'edit' && 'bg-zinc-200 text-zinc-900 hover:bg-zinc-300'">Edit</button>

      <div x-show="open === 'edit'" x-cloak data-panel="edit" role="menu" aria-label="Edit"
           @keydown.arrow-down.prevent="move(1)" @keydown.arrow-up.prevent="move(-1)"
           @keydown.home.prevent="edge(false)" @keydown.end.prevent="edge(true)"
           @keydown.arrow-right.prevent="step(1)" @keydown.arrow-left.prevent="step(-1)"
           @keydown.tab="close()"
           class="absolute top-full left-0 z-40 mt-1 w-64 max-w-[calc(100vw-2rem)] rounded-xl border border-zinc-200 bg-white py-1 shadow-lg">
        <button type="button" role="menuitem" tabindex="-1" @click="close()"
                class="flex w-full items-center gap-2.5 px-3 py-2 text-left text-[13px]/5 hover:bg-zinc-100 focus:bg-zinc-100 focus:outline-2 focus:-outline-offset-2 focus:outline-zinc-700">
          <i data-lucide="rows-3" class="size-4 text-zinc-600"></i>Insert line
        </button>
        <button type="button" role="menuitem" tabindex="-1" @click="close()"
                class="flex w-full items-center gap-2.5 px-3 py-2 text-left text-[13px]/5 hover:bg-zinc-100 focus:bg-zinc-100 focus:outline-2 focus:-outline-offset-2 focus:outline-zinc-700">
          <i data-lucide="search" class="size-4 text-zinc-600"></i>Find item code
        </button>
      </div>
    </div>
  </div>

  <div class="px-4 py-3">
    <h2 class="text-[16px]/6 font-semibold tabular-nums">PO-24-1187 — Gujarat Polymers Ltd</h2>
    <p class="mt-1 text-[13px]/5 tabular-nums text-zinc-600">Approved 18 Aug 2026 · 14 lines · ₹18,42,000 before tax</p>
  </div>

  <!-- No @click.self on the backdrop: an alert dialog is a question and a stray
       click is not an answer. Keep the order is first in the DOM, so the trap
       opens on it rather than on the button that voids the order. -->
  <div x-show="voiding" x-cloak x-trap.noscroll="voiding" @keydown.escape.window="voiding = false"
       class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-4">
    <div role="alertdialog" aria-modal="true" aria-labelledby="mb-void-title" aria-describedby="mb-void-body"
         class="w-full max-w-md rounded-xl border border-zinc-300 bg-white p-5 shadow-lg">
      <div class="flex items-start gap-3">
        <i data-lucide="alert-circle" class="mt-0.5 size-4 shrink-0 text-red-600"></i>
        <div class="min-w-0">
          <h2 id="mb-void-title" class="text-[16px]/6 font-semibold">Void PO-24-1187</h2>
          <p class="mt-1.5 text-[13px]/5 tabular-nums text-zinc-600">Gujarat Polymers Ltd · ₹18,42,000 · approved 18 Aug 2026.</p>
          <p id="mb-void-body" class="mt-2 text-[13px]/5 font-medium text-red-600">
            GRN 4471 covers 9 of the 14 lines and stays posted. The vendor is emailed the cancellation. This cannot be undone.
          </p>
        </div>
      </div>
      <div class="mt-5 flex flex-wrap justify-end gap-2">
        <button type="button" @click="voiding = false"
                class="rounded-lg border border-zinc-300 bg-white px-4 py-2 text-[13px]/5 font-medium hover:bg-zinc-100 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Keep the order</button>
        <button type="button" @click="voiding = false"
                class="rounded-lg bg-red-600 px-4 py-2 text-[13px]/5 font-medium text-white hover:bg-red-700 focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-zinc-700/15">Void order</button>
      </div>
    </div>
  </div>
</div>
